<style>

<body>
<div id="wrap"><div id="cv"></div></div>
<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1050ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the Vestanam maths: chop the last digit, subtract double it from the rest ---------- */
function v7(n){
  const vals=[n],rounds=[];let v=n,ok=true;
  while(v>=100){const s=String(v),ld=+s.slice(-1),rest=+s.slice(0,-1),dbl=ld*2,raw=rest-dbl;if(raw<0)ok=false;const res=Math.abs(raw);rounds.push({ld,rest,dbl,res});v=res;vals.push(v)}
  return {n,vals,rounds,K:rounds.length,fin:v,yes:v%7===0,ok};
}
const TESTS=[];for(let n=100;n<=99999;n+=7)TESTS.push(n,n+1,n+3);
const bad=TESTS.filter(n=>v7(n).yes!==(n%7===0));
console.log(bad.length?'[Vedica] Vestanam tests FAILED '+bad.slice(0,5):'[Vedica] '+TESTS.length+'/'+TESTS.length+' Vestanam tests pass');

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
const SP=26;
/* the number as a row of digits. split=true pulls the last digit away from the rest */
function rowOf(S,Y,k,split,y,base){
  y=y||RY;base=base||BLUE;
  const s=String(Y.vals[k]),n=s.length,xs=xsOf(n,512,ADV),ids=[];
  digs(s).forEach((d,i)=>{const l=i===n-1;S.el('r'+k+'_'+i,d,xs[i]+(split?(l?SP:-SP):0),y,{c:split&&l?OR:base});ids.push('r'+k+'_'+i)});
  return {ids,xs,n,rest:ids.slice(0,-1),last:ids[n-1]};
}
const dvd=(S,r,id,y,o)=>S.box(id,(r.xs[r.n-2]+r.xs[r.n-1])/2,y,5,128,{fill:'#cbd7e3',c:'#cbd7e3',r:3,o});
const multsOf7=f=>{const a=[];for(let m=f===0?0:7;m<=f+7;m+=7)a.push(m);const t=a.slice(-6);return (t.length<a.length?'… ':'')+t.join(' · ')};

/* ---------- scenes: one per idea, all driven by v7() ---------- */
const ST={
  meet(S,Y,ph){
    const r=rowOf(S,Y,0,false,RY,ph>=2?BLUE:INK);S.el('lbl',Y.n+' ÷ 7 ?',512,168,{z:36,c:MU,w:800});
    if(ph===0)S.hide([...r.ids,'lbl']);
    if(ph>=2){S.f(r.ids);S.h(r.last)}
  },
  rule(S,Y,ph){
    const r=rowOf(S,Y,0,false);
    const b=bub(S,[{id:'wr',t:'rest',c:BLUE,o:ph>=1?1:0},{id:'wm',t:'−',op:1,o:ph>=2?1:0},{id:'w2',t:'2 ×',op:1,c:OR,o:ph>=2?1:0},{id:'wl',t:'last digit',c:OR,o:ph>=3?1:0}],ph>=1?1:0,0,0);
    S.el('nt','Repeat until you have 2 digits or fewer',512,640,{z:26,c:MU,w:800,o:ph>=3?1:0});
    if(ph>=1)S.arrow(0,[512,RY+56],[b.xs[0]-6,BY-62],{st:ph>=3?2:1,bend:.25});
    if(ph===0){S.f(r.ids);S.h(r.last)}
    if(ph===1){S.f('bub','wr');S.h('wr')}
    if(ph===2){S.f('bub','wr','wm','w2');S.h('w2')}
    if(ph>=3){S.f('bub',b.ids,'nt');S.h('wl')}
  },
  split(S,Y,ph,k){
    const R=Y.rounds[k],r=rowOf(S,Y,k,ph>=1);
    S.el('rl','Round '+(k+1),512,140,{z:32,c:MU,w:800});
    dvd(S,r,'dv',RY,ph>=1?1:0);
    const rx=(r.xs.slice(0,-1).reduce((a,b)=>a+b,0)/(r.n-1))-SP;
    S.el('lr','rest',rx,RY-92,{z:24,c:BLUE,w:800,o:ph===2?1:0});
    S.el('ll','last digit',r.xs[r.n-1]+SP,RY-92,{z:24,c:OR,w:800,o:ph===2?1:0});
    S.box('tag',512,210,350,64,{shadow:true,r:22,q:'Last digit = '+R.ld,qz:28,qc:OR,o:ph>=3?1:0,s:ph>=3?1:.9});
    if(ph===1){S.f(r.ids,'dv');S.h(r.last)}
    if(ph===2){S.f(r.ids,'dv','lr','ll');S.h(r.last)}
    if(ph>=3){S.f('tag',r.last);S.hand={x:512,y:250}}
  },
  dbl(S,Y,ph,k){
    const R=Y.rounds[k],r=rowOf(S,Y,k,true);
    S.el('rl','Round '+(k+1),512,140,{z:32,c:MU,w:800});dvd(S,r,'dv',RY,1);
    const b=bub(S,[{id:'ba',t:R.ld,c:OR},{id:'bx',t:'×',op:1},{id:'b2',t:'2',op:1,c:OR},{id:'be',t:'=',op:1},{id:'br',t:R.dbl,c:OR,res:1}],ph>=1?1:0,ph>=1?1:0,ph>=2?1:0);
    S.el('zl',R.ld+' + '+R.ld+' = '+R.dbl,512,640,{z:26,c:MU,w:800,o:ph>=3?1:0});
    if(ph>=1)S.arrow(0,[r.xs[r.n-1]+SP,RY+56],[b.xs[0]-6,BY-62],{st:ph>=2?2:1,bend:.25});
    if(ph===0){S.f(r.ids,'dv');S.h(r.last)}
    if(ph===1){S.f(r.last,'bub',b.rest);S.h('ba')}
    if(ph===2){S.f('bub',b.res);S.h('br')}
    if(ph>=3){S.f('bub',b.ids,'zl');S.h('br')}
  },
  sub(S,Y,ph,k){
    const R=Y.rounds[k],r=rowOf(S,Y,k,true),ns=String(R.res).length,nid=i=>'r'+(k+1)+'_'+i;
    S.el('rl','Round '+(k+1),512,140,{z:32,c:MU,w:800});dvd(S,r,'dv',RY,ph<4?1:0);
    S.el('gd',R.dbl,512,196,{z:54,c:OR,o:ph>=1&&ph<4?1:0});
    const b=bub(S,[{id:'sa',t:R.rest,c:BLUE},{id:'so',t:'−',op:1},{id:'sb',t:R.dbl,c:OR},{id:'se',t:'=',op:1},...digs(R.res).map((d,i)=>({id:nid(i),t:d,c:BLUE,res:1,g:i<ns-1?0:undefined}))],ph>=2&&ph<4?1:0,ph>=2&&ph<4?1:0,ph>=3?1:0);
    if(ph>=1)S.mod(r.last,{o:.28});
    if(ph>=2&&ph<4)S.arrow(0,[512,RY+56],[b.xs[0]-6,BY-62],{st:ph>=3?2:1,bend:.25});
    if(ph===0){S.f(r.ids,'dv');S.h(r.last)}
    if(ph===1){S.f('gd',r.rest);S.h('gd')}
    if(ph===2){S.f('bub',b.rest);S.h('sb')}
    if(ph===3){S.f('bub',b.res);S.h(b.res[ns-1])}
    if(ph>=4){
      const nx=xsOf(ns,512,ADV);
      b.res.forEach((id,i)=>S.mod(id,{x:nx[i],y:RY,s:Z/52,o:1}));
      b.rest.forEach(id=>S.mod(id,{o:0}));S.mod('bub',{o:0,s:.9});r.ids.forEach(i=>S.mod(i,{o:0}));
      S.f(b.res);S.h(b.res[ns-1]);
    }
  },
  verdict(S,Y,ph){
    const r=rowOf(S,Y,Y.K,false,RY,ph>=2?(Y.yes?GR:OR):BLUE),col=Y.yes?GR:OR;
    S.el('rl','Is it in the 7 times table?',512,140,{z:32,c:MU,w:800});
    S.el('mt','Multiples of 7:  '+multsOf7(Y.fin),512,560,{z:26,c:MU,w:800,o:ph>=1&&ph<3?1:0});
    S.el('ck',Y.yes?'Check: 7 × '+(Y.n/7)+' = '+Y.n:Y.n+' ÷ 7 = '+Math.floor(Y.n/7)+' remainder '+(Y.n%7),512,560,{z:26,c:col,w:800,o:ph>=3?1:0});
    S.box('tag',512,210,Y.yes?400:380,64,{shadow:true,r:22,q:Y.yes?'Yes ✓  Multiple of 7':'No ✗  Not a multiple of 7',qz:26,qc:col,o:ph>=2?1:0,s:ph>=2?1:.9});
    if(ph===0){S.f(r.ids);S.h(r.last)}
    if(ph===1)S.f(r.ids,'mt');
    if(ph>=2){S.finale={x:512,y:RY,w:Math.max(300,r.n*ADV+140),h:160};S.win=Y.yes}
    if(ph===2){S.f('tag',r.ids);S.hand={x:512,y:250}}
    if(ph>=3){S.f('ck','tag',r.ids);S.h('ck')}
  },
};
const SUM={
  split:(Y,s)=>'Last digit: '+Y.rounds[s.k].ld,
  dbl:(Y,s)=>Y.rounds[s.k].ld+' × 2 = '+Y.rounds[s.k].dbl,
  sub:(Y,s)=>Y.rounds[s.k].rest+' − '+Y.rounds[s.k].dbl+' = '+Y.rounds[s.k].res,
  verdict:Y=>'Answer: '+(Y.yes?'Yes':'No'),
};
const HL={split:OR,dbl:OR,sub:BLUE};
const hlOf=(g,Y)=>g==='verdict'?(Y.yes?GR:OR):(HL[g]||BLUE);
const CAP={
  meet:Y=>'Is **'+Y.n+'** a multiple of 7? Vestanam gives a quick test. **Watch this.**',
  rule:Y=>'The rule: chop off the **last digit**, then subtract **double** it from the **rest**.',
  split:(Y,s)=>{const R=Y.rounds[s.k];return (s.k?'Round '+(s.k+1)+'. ':'')+'Chop off the last digit of '+Y.vals[s.k]+': **'+R.ld+'** is the last digit and **'+R.rest+'** is the rest.'},
  dbl:(Y,s)=>{const R=Y.rounds[s.k];return 'Double the last digit: **'+R.ld+' × 2 = '+R.dbl+'**.'},
  sub:(Y,s)=>{const R=Y.rounds[s.k],ns=String(R.res).length;return 'Subtract it from the rest: **'+R.rest+' − '+R.dbl+' = '+R.res+'**. '+(s.k<Y.K-1?R.res+' still has '+ns+' digits, so go again.':R.res+' is small enough to check.')},
  verdict:Y=>Y.fin===0?'**0** counts as a multiple of 7. So **'+Y.n+'** is a **multiple of 7**!':Y.yes?'**'+Y.fin+'** is in the 7 times table. So **'+Y.n+'** is a **multiple of 7**!':'**'+Y.fin+'** is not in the 7 times table. So **'+Y.n+'** is **not** a multiple of 7.',
};
const TM={meet:[[0,800,2300],3600],rule:[[0,800,2300,3800],5100],split:[[0,800,2300,3800],5100],dbl:[[0,800,2300,3800],5100],sub:[[0,800,2300,3800,5300],6600],verdict:[[0,800,2300,3800],5100],practice:[[0,500],700]};
const LIST=[['meet',2527,'Meet the problem'],['rule',2527,'The Vestanam rule'],
['split',2527,'Round 1 · last digit',0],['dbl',2527,'Round 1 · double it',0],['sub',2527,'Round 1 · subtract',0],
['split',2527,'Round 2 · last digit',1],['dbl',2527,'Round 2 · double it',1],['sub',2527,'Round 2 · subtract',1],['verdict',2527,'Read the answer'],
['meet',2528,'A “No” example'],['split',2528,'Round 1 · last digit',0],['dbl',2528,'Round 1 · double it',0],['sub',2528,'Round 1 · subtract',0],
['split',2528,'Round 2 · last digit',1],['dbl',2528,'Round 2 · double it',1],['sub',2528,'Round 2 · subtract',1],['verdict',2528,'Not a multiple'],
['meet',343,'A shorter one'],['split',343,'Last digit',0],['dbl',343,'Double it',0],['sub',343,'Subtract',0],['verdict',343,'Read the answer'],
['practice',0,'Your turn']];
const STEPS=LIST.map(([g,n,name,k])=>({g,n,name,k,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Vestanam: chop the last digit, subtract double it from the rest';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[3185,4622,1736,6049];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomN(){for(let i=0;i<200;i++){const n=Math.random()<.5?7*rnd(15,1400):rnd(100,9999);if(v7(n).ok)return n}return 2527}

function tasks(Y){
  const T=[];
  Y.rounds.forEach((R,k)=>{
    T.push({k,g:'dbl',cap:'Round '+(k+1)+': the number is **'+Y.vals[k]+'**. Double the last digit: **'+R.ld+' × 2**.',q:R.ld+' × 2',ans:String(R.dbl),ex:[R.ld,'×','2'],hint:'Close! Doubling means times 2.'});
    T.push({k,g:'sub',cap:'Now subtract: **'+R.rest+' − '+R.dbl+'**. The rest is everything except the last digit.',q:R.rest+' − '+R.dbl,ans:String(R.res),ex:[R.rest,'−',R.dbl],hint:'Close! Take the doubled digit away from the rest.'});
  });
  T.push({k:Y.K,g:'verdict',cap:'We end at **'+Y.fin+'**. Is it a multiple of 7? Type **1** for Yes or **0** for No.',q:'1 = Yes, 0 = No',ok:Y.fin+(Y.yes?' is a multiple of 7':' is not a multiple of 7'),ans:Y.yes?'1':'0',hint:'Close! Check the 7 times table: 7, 14, 21, 28…'});
  return T;
}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,tk=T[t],fin=pr.done||(pr.ok&&t===T.length-1),k=tk.k,last=k===Y.K;
  if(fin){const r=rowOf(S,Y,Y.K,false,250);r.ids.forEach(i=>S.mod(i,{c:Y.yes?GR:OR}));S.finale={x:512,y:250,w:Math.max(300,r.n*ADV+140),h:150};return}
  const r=rowOf(S,Y,k,!last,250);
  S.el('prl',last?'Final check':'Round '+(k+1),512,140,{z:32,c:MU,w:800});
  if(!last)dvd(S,r,'dv',250,1);
  if(tk.ex){
    const ex=tk.ex,ids=ex.map((_,i)=>'te'+t+'_'+i),q=seq(S,ex.map((x,i)=>({id:ids[i],t:String(x),op:i===1})),512,368,46);
    S.box('tb'+t,512,368,Math.max(240,q.total+90),84,{shadow:true,r:26});S.f(r.ids,'prl','dv','tb'+t,ids);
  }else S.f(r.ids,'prl');
}

cv.innerHTML=`

 <div class="nun" style="display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.03em"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#0a84ff;color:#fff;font-size:16px;font-style:italic;box-shadow:0 5px 12px rgba(10,132,255,.22)">V</span>Vedica</div>
 <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600"><span style="color:#8391a6">Divisibility by 7</span><span style="color:#d3dbe4">·</span><span id="sn" style="color:#0a84ff;font-weight:700"></span><span id="sm" style="color:#8290a5"></span></div>
 <button id="x" class="rb" aria-label="Exit lesson" title="Exit lesson" style="width:40px;height:40px"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>

<svg class="abs" width="1024" height="768" viewBox="0 0 1024 768" style="left:0;top:0;pointer-events:none;overflow:visible"><path id="a0"/><path id="a1"/></svg>

  $('rh').style.opacity=items.length?1:0;

  // captions, practice
  const pr=st.pr||freshPr(),prac=st.step===LAST&&st.phase>=1,Y=prac?v7(cur().n):null;let capStr,hl=BLUE;
  if(st.step<LAST){const d=STEPS[st.step],y=v7(d.n);capStr=CAP[d.g](y,d);hl=hlOf(d.g,y)}
  else if(!Y)capStr='Your turn.';
  else if(pr.replay){const d=STEPS[pr.replay.s];capStr=CAP[d.g](Y,{k:pr.replay.k});hl=hlOf(d.g,Y)}
  else if(pr.done){capStr='**'+Y.n+'** is '+(Y.yes?'':'not ')+'a multiple of 7. Same rule, every time.';hl=GR}
  else{const T=tasks(Y)[pr.task];if(pr.ok){capStr='**Yes!** '+(T.ok||T.q+' = '+T.ans)+'.';hl=GR}else capStr=T.cap}
  capNow=capStr.replace(/\*\*/g,'');
  const cap=$('cap');cap.innerHTML=capStr.split('**').map((t,i)=>t?(i%2?'<span style="color:'+hl+';font-weight:800">'+t+'</span>':'<span>'+t+'</span>'):'').join('');
  Object.assign(cap.style,{opacity:st.capIn?1:0,transform:'translateY('+(st.capIn?0:8)+'px)',filter:st.capIn?'blur(0)':'blur(4px)',transition:st.capIn?'opacity 450ms ease,transform 550ms cubic-bezier(.32,.72,0,1),filter 450ms ease':'none'});
  $('sn').textContent=st.step===LAST?'Practice':'Step '+(st.step+1)+' of '+LAST;$('sm').textContent=STEPS[st.step].name;
  pgBars.forEach((f,i)=>{const s=STEPS[i];let w=0,tr='none';
    if(i<st.step)w=100;else if(i===st.step){if(st.step<LAST){if(st.done){w=100;tr='width 300ms ease'}else if(st.capIn){w=100;tr='width '+s.end+'ms linear'}}else{w=(pr.pi+(pr.done||pr.ok?1:0))/pr.list.length*100;tr='width 600ms cubic-bezier(.32,.72,0,1)'}}
    f.style.width=w+'%';f.style.transition=tr});
  const showP=prac&&!pr.done&&!pr.replay;
  $('pr').style.display=showP?'flex':'none';$('keys').style.display=showP?'flex':'none';$('dn').style.display=prac&&pr.done?'flex':'none';$('tap').style.display=st.step<LAST&&!st.info?'block':'none';
  const col=pr.ok?GR:pr.bad?OR:BLUE;
  Object.assign($('inp').style,{minWidth:'100px',height:'78px',padding:'0 18px',boxSizing:'border-box',borderRadius:'22px',border:'3px solid '+col,background:pr.ok?'#eefaf3':pr.bad?'#fff5eb':'#f4f9ff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'46px',letterSpacing:'.02em',color:pr.input?col:'#b5c3d2',transform:'translateX('+pr.shake+'px) scale('+(pr.ok?1.06:1)+')',transition:'transform 110ms ease,border-color 200ms,background 200ms,color 200ms'});
  $('inp').textContent=pr.input||'?';
  let ht='Use the sutra from the lesson.';if(Y&&pr.wrong>0)ht=tasks(Y)[pr.task].hint;if(pr.again)ht='Your turn again.';if(pr.ok)ht='That’s it.';
  $('hint').textContent=ht;$('hint').style.color=pr.wrong&&!pr.ok&&!pr.again?'#a8662a':pr.ok?GR:'#8a97aa';
  $('su').textContent=SUTRA;
  const exp=(st.done&&st.step<LAST)||(st.step===LAST&&false),nx=$('nx');
  Object.assign(nx.style,{width:(exp?124:56)+'px',gap:exp?'6px':'0',background:exp?BLUE:'#e7f1fd',color:exp?'#fff':BLUE,boxShadow:exp?'0 10px 24px rgba(10,132,255,.3)':'none'});
  Object.assign($('nxl').style,{maxWidth:exp?'60px':'0',opacity:exp?1:0});
  $('nxi').setAttribute('d',st.step===LAST?'M20 12a8 8 0 1 1-2.3-5.7M20 5v5h-5':'m9.5 6 6 6-6 6');nx.setAttribute('aria-label',st.step===LAST?'Start the lesson again':'Next step');
  $('bk').style.color=st.step===0?'#c3ccd6':'#3a4860';
  // info, narration menu
  const inf=$('info');inf.style.display=st.info?'grid':'none';inf.style.opacity=st.infoShow?1:0;
  Object.assign($('card').style,{opacity:st.infoShow?1:0,transform:'translateY('+(st.infoShow?0:14)+'px) scale('+(st.infoShow?1:.92)+')'});
  Object.assign($('ex2').style,{opacity:st.infoShow?1:0,transform:st.infoShow?'none':'translateY(8px) scale(.8)'});
  const on=st.audio,sk=$('spk');Object.assign(sk.style,{background:on?BLUE:'#fff',color:on?'#fff':'#3a4860',borderColor:on?BLUE:'#e1e8ef',boxShadow:on?'0 8px 18px rgba(10,132,255,.28)':'0 4px 12px rgba(23,35,58,.06)'});
  $('wv').setAttribute('d',on?'M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11':'m16 9.5 5 5m0-5-5 5');
  const ln=(LANGS.find(l=>l[0]===st.lang)||LANGS[0])[1];sk.setAttribute('aria-label',on?'Narration on · '+ln:'Narration off');
  const mn=$('menu');Object.assign(mn.style,{position:'absolute',right:'58px',top:0,width:'200px',padding:'6px',boxSizing:'border-box',borderRadius:'20px',background:'rgba(255,255,255,.96)',backdropFilter:'blur(20px)',border:'1px solid #e6ecf2',boxShadow:'0 18px 44px rgba(23,35,58,.16)',display:'flex',flexDirection:'column',gap:'2px',opacity:st.menu?1:0,transform:'translateX('+(st.menu?0:8)+'px) scale('+(st.menu?1:.96)+')',transformOrigin:'right top',pointerEvents:st.menu?'auto':'none',transition:'opacity 180ms ease-out,transform 220ms cubic-bezier(.2,.8,.2,1)'});
  if(!mn.children.length)mn.innerHTML='<div style="padding:6px 12px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8391a6">Narration</div>'+LANGS.map(l=>'<button data-l="'+l[0]+'" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:14px;text-align:left"><span style="display:flex;flex-direction:column;align-items:flex-start"><span style="font-size:15px;font-weight:700">'+l[2]+'</span><span style="font-size:12px;font-weight:500;color:#8391a6">'+l[1]+'</span></span><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#0a84ff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>').join('');
  [...mn.querySelectorAll('button')].forEach(b=>{const s=b.dataset.l===st.lang;b.style.background=s?'#eaf3ff':'transparent';b.style.color=s?BLUE:INK;b.lastChild.style.opacity=s?1:0});
  if(st.audio&&st.capIn&&capNow!==spoken)speak();
}
function fit(){const k=Math.min(innerWidth/1024,innerHeight/768);$('cv').style.transform='scale('+k+')'}
function openInfo(){st.info=true;st.menu=false;render();setTimeout(()=>{st.infoShow=true;render()},20)}
function closeInfo(){st.infoShow=false;render();setTimeout(()=>{st.info=false;render();const p=pending;pending=null;if(p)p()},260)}
$('inf').onclick=openInfo;$('ix').onclick=closeInfo;$('ist').onclick=closeInfo;$('info').onclick=closeInfo;$('card').onclick=e=>e.stopPropagation();
$('tap').onclick=stageTap;$('nx').onclick=next;$('bk').onclick=back;$('rp').onclick=()=>go(st.step);
$('x').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}go(0)};
$('wa').onclick=()=>go(0);$('ta').onclick=()=>go(LAST,{list:[{n:randomN()}]});
$('spw').onmouseenter=()=>{st.menu=true;render()};$('spw').onmouseleave=()=>{st.menu=false;render()};
$('spk').onclick=()=>{st.audio=!st.audio;st.menu=true;savePref();if(st.audio){spoken=null;render()}else{try{speechSynthesis.cancel()}catch(e){}render()}};
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.lang=b.dataset.l;st.audio=true;spoken=null;savePref();render()};
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(st.info){if(e.key==='Escape')closeInfo();return}
  if(/^[0-9]$/.test(e.key))return press(e.key);
  if(e.key==='Backspace')return del();
  if(e.key==='ArrowRight')return next();if(e.key==='ArrowLeft')return back();
  if(e.key===' '&&st.step<LAST){e.preventDefault();return stageTap()}
  if(e.key==='r'||e.key==='R')return go(st.step);
});
try{const v=JSON.parse(localStorage.getItem('vedica-narration')||'null');if(v){st.lang=v.lang||'en';st.audio=!!v.audio}}catch(e){}
fit();
// Resume: every step is saved, and an unfinished lesson reopens at the step it was left on.
(function(){var K='vedica-resume',id=window.__vdLesson||location.pathname.split('/').pop(),g=go,sv;
go=function(s,o){try{var r=JSON.parse(localStorage.getItem(K)||'{}');r[id]=s;localStorage.setItem(K,JSON.stringify(r))}catch(e){}return g(s,o)};
try{sv=JSON.parse(localStorage.getItem(K)||'{}')[id]}catch(e){}
if(sv>0&&sv<=LAST)go(sv);else{pending=()=>go(0);openInfo()}})();
</script>
