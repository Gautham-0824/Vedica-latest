<body>
<div id="wrap"><div id="cv"></div></div>
<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1050ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: Anurupye Shunyamanyat (if one is in ratio, the other is zero) ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
const COL={a:298,x:364,p:428,b:496,y:570,e:634,c:714};
function yav(n,m){
  const [a1,b1,c1]=n.split('.').map(Number),[a2,b2,c2]=m.split('.').map(Number);
  const yOk=b1*c2===b2*c1,xOk=a1*c2===a2*c1,ok=yOk||xOk,R=xOk&&!yOk?'x':'y',Z=R==='y'?'x':'y';
  const r1=R==='y'?b1:a1,r2=R==='y'?b2:a2,g1=gcd(r1,r2),g2=gcd(c1,c2);
  return {n,m,a1,b1,c1,a2,b2,c2,ok,R,Z,r1,r2,rp:r1/g1,rq:r2/g1,cp:c1/g2,cq:c2/g2,val:ok?c1/r1:null,zero:Z+' = 0'};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const E1=240,E2=330,CY=435,TY=150,colOf=()=>BLUE;
const fe=(Y,k)=>Y['a'+k]+'x + '+Y['b'+k]+'y = '+Y['c'+k];
const rcx=Y=>Y.R==='y'?COL.b:COL.a,rids=Y=>Y.R==='y'?['b1','b2']:['a1','a2'],zids=Y=>Y.R==='y'?['a1','a2']:['b1','b2'];
const isOpId=i=>/^[pe]\d/.test(i);
function eqs(S,Y,y1,y2){
  const rows=[[Y.a1,Y.b1,Y.c1],[Y.a2,Y.b2,Y.c2]],ys=[y1,y2],ids=[];
  rows.forEach((r,i)=>{const k=i+1;
    [['a',r[0]],['x','x'],['p','+'],['b',r[1]],['y','y'],['e','='],['c',r[2]]].forEach(([c,t])=>{
      const op=c==='p'||c==='e';S.el(c+k,t,COL[c],ys[i],{c:op?MU:INK,w:op?700:900,z:op?50:62});ids.push(c+k)})});
  return ids;
}
function chip(S,Y,k){
  const cx=k==='R'?rcx(Y):COL.c,p=k==='R'?Y.rp:Y.cp,q=k==='R'?Y.rq:Y.cq;
  S.box('h'+k,cx,CY,128,66,{shadow:true,r:18});
  [p,':',q].forEach((t,i)=>S.el(k+i,t,cx+(i-1)*32,CY,{z:40,c:OR}));
}
function tags(S,Y,col,ty,o){
  const zx=Y.Z==='x'?392:632,rx=Y.Z==='x'?632:392;
  S.box('tag',zx,ty,200,64,{shadow:true,r:22,q:Y.zero,qz:28,qc:col,...o});
  S.box('tag2',rx,ty,200,64,{shadow:true,r:22,q:Y.R+' = '+Y.val,qz:28,qc:col,...o});
}
function ratio(S,Y,ph,k){
  const ids=eqs(S,Y,E1,E2),R=k==='R';if(!R)chip(S,Y,'R');
  const src=R?rids(Y):['c1','c2'],cx=R?rcx(Y):COL.c,a=R?Y.r1:Y.c1,b=R?Y.r2:Y.c2,p=R?Y.rp:Y.cp,q=R?Y.rq:Y.cq;
  const bb=bub(S,[{id:'u0',t:a},{id:'u1',t:':',op:1},{id:'u2',t:b},{id:'u3',t:'=',op:1},{id:k+'0',t:p,res:1,c:OR},{id:k+'1',t:':',op:1,res:1,c:OR},{id:k+'2',t:q,res:1,c:OR}],ph>=1?1:0,ph>=1?1:0,ph>=2?1:0);
  if(ph<3)src.forEach(i=>S.mod(i,{c:BLUE}));
  S.box('h'+k,cx,CY,128,66,{shadow:true,r:18,o:ph>=3?1:0,s:ph>=3?1:.9});
  if(ph===0){S.f(src);S.h(src[0])}
  if(ph===1){S.f(src,'bub',bb.rest);S.h('u1')}
  if(ph===2){S.f(src,'bub',bb.ids);S.h(k+'0')}
  if(ph>=1&&ph<3)S.arrow(0,[cx,E2+44],[bb.xs[0]-6,BY-62],{st:ph>=2?2:1,bend:.25});
  if(ph>=3){bb.res.forEach((id,i)=>S.mod(id,{x:cx+(i-1)*32,y:CY,s:40/52,o:1}));bb.rest.forEach(id=>S.mod(id,{o:0}));S.mod('bub',{o:0,s:.9});S.f('h'+k,bb.res);S.h(k+'0')}
}
const ST={
  meet(S,Y,ph){const ids=eqs(S,Y,E1,E2);if(ph===0)S.hide(ids);if(ph>=2){S.f(ids);S.h('c1')}},
  ratR:(S,Y,ph)=>ratio(S,Y,ph,'R'),ratC:(S,Y,ph)=>ratio(S,Y,ph,'C'),
  same(S,Y,ph){
    eqs(S,Y,E1,E2);chip(S,Y,'R');chip(S,Y,'C');
    const col=Y.ok?GR:OR,msg=Y.ok?'Same ratio!':'Different ratios';
    const bb=bub(S,[{id:'s0',t:Y.rp,c:OR},{id:'s1',t:':',op:1,c:OR},{id:'s2',t:Y.rq,c:OR},{id:'s3',t:Y.ok?'=':'≠',op:1,c:col},{id:'s4',t:Y.cp,c:OR},{id:'s5',t:':',op:1,c:OR},{id:'s6',t:Y.cq,c:OR}],ph>=1?1:0,ph>=1?1:0,1);
    S.box('tag',512,TY,300,64,{shadow:true,r:22,q:msg,qz:28,qc:col,o:ph>=2?1:0,s:ph>=2?1:.9});
    if(ph>=2){S.mod('hR',{c:col});S.mod('hC',{c:col})}
    if(ph===0){S.f('hR','R0','R1','R2','hC','C0','C1','C2');S.h('C2')}
    if(ph===1){S.f('bub',bb.ids);S.h('s3')}
    if(ph>=2){S.f('tag','hR','R0','R1','R2','hC','C0','C1','C2','bub',bb.ids);S.h('s6')}
  },
  zero(S,Y,ph){
    eqs(S,Y,E1,E2);chip(S,Y,'R');chip(S,Y,'C');S.mod('hR',{c:GR});S.mod('hC',{c:GR});
    const zc=zids(Y);zc.forEach(i=>S.mod(i,{c:OR}));
    S.box('tag',512,TY,200,64,{shadow:true,r:22,q:Y.zero,qz:28,qc:OR,o:ph>=1?1:0,s:ph>=1?1:.9});
    if(ph===0){S.f(zc);S.h(zc[0])}
    if(ph>=1){S.f(zc,'tag');S.hand={x:512,y:190}}
  },
  solve(S,Y,ph){
    eqs(S,Y,E1,E2);const zx=Y.Z==='x'?392:632,rx=Y.Z==='x'?632:392,rc=rids(Y)[0];
    zids(Y).forEach(i=>S.mod(i,{c:OR}));
    S.box('tag',zx,TY,200,64,{shadow:true,r:22,q:Y.zero,qz:28,qc:OR});
    S.box('tag2',rx,TY,200,64,{shadow:true,r:22,q:Y.R+' = '+Y.val,qz:28,qc:OR,o:ph>=3?1:0,s:ph>=3?1:.9});
    const bb=bub(S,[{id:'v0',t:Y.c1},{id:'v1',t:'÷',op:1},{id:'v2',t:Y.r1},{id:'v3',t:'=',op:1},{id:'rv',t:Y.val,res:1,c:OR}],ph>=1?1:0,ph>=1?1:0,ph===2?1:0);
    if(ph<3){S.mod(rc,{c:BLUE});S.mod('c1',{c:BLUE})}
    if(ph===0){S.f(rc,'c1','tag');S.h(rc)}
    if(ph===1){S.f(rc,'c1','bub',bb.rest);S.h('v1')}
    if(ph===2){S.f('bub',bb.ids);S.h('rv')}
    if(ph>=3){S.mod('bub',{o:0,s:.9});bb.ids.forEach(id=>S.mod(id,{o:0}));S.f('tag','tag2');S.hand={x:512,y:190}}
  },
  nope(S,Y,ph){
    eqs(S,Y,E1,E2);const ry=rids(Y),cs=['c1','c2'],rx=rcx(Y);
    S.box('hR',rx,CY,128,66,{shadow:true,r:18,c:ph>=4?OR:'#e1e8ef',o:ph>=1?1:0,s:ph>=1?1:.9});
    S.box('hC',COL.c,CY,128,66,{shadow:true,r:18,c:ph>=4?OR:'#e1e8ef',o:ph>=3?1:0,s:ph>=3?1:.9});
    [Y.rp,':',Y.rq].forEach((t,i)=>S.el('R'+i,t,rx+(i-1)*32,CY,{z:40,c:OR,o:ph>=1?1:0}));
    [Y.cp,':',Y.cq].forEach((t,i)=>S.el('C'+i,t,COL.c+(i-1)*32,CY,{z:40,c:OR,o:ph>=3?1:0}));
    S.box('tag',512,TY,300,64,{shadow:true,r:22,q:'Different ratios',qz:28,qc:OR,o:ph>=4?1:0,s:ph>=4?1:.9});
    if(ph<2)ry.forEach(i=>S.mod(i,{c:BLUE}));
    if(ph===2||ph===3)cs.forEach(i=>S.mod(i,{c:BLUE}));
    if(ph===0){S.f(ry);S.h(ry[0])}
    if(ph===1){S.f(ry,'hR','R0','R1','R2');S.h('R2')}
    if(ph===2){S.f(cs,'hR','R0','R1','R2');S.h('c1')}
    if(ph===3){S.f(cs,'hC','C0','C1','C2');S.h('C2')}
    if(ph>=4){S.f('tag','hR','R0','R1','R2','hC','C0','C1','C2');S.h('tag')}
  },
  check(S,Y,ph){
    const ids=eqs(S,Y,E1,E2);tags(S,Y,OR,TY);zids(Y).forEach(i=>S.mod(i,{c:OR}));
    const src=[rids(Y)[1],'c2'];
    const bb=bub(S,[{id:'w0',t:Y.r2},{id:'w1',t:'×',op:1},{id:'w2',t:Y.val,c:OR},{id:'w3',t:'=',op:1},{id:'w4',t:Y.c2,res:1,c:GR}],ph>=1?1:0,ph>=1?1:0,ph>=2?1:0);
    if(ph<3)src.forEach(i=>S.mod(i,{c:BLUE}));
    if(ph===0){S.f(src,'tag2');S.h(src[0])}
    if(ph===1){S.f(src,'bub',bb.rest);S.h('w1')}
    if(ph===2){S.f('bub',bb.ids);S.h('w4')}
    if(ph>=3){ids.forEach(i=>S.mod(i,{c:isOpId(i)?MU:GR}));S.mod('tag',{qc:GR});S.mod('tag2',{qc:GR});S.mod('bub',{o:0,s:.9});bb.ids.forEach(id=>S.mod(id,{o:0}));S.f(ids);S.finale={x:506,y:(E1+E2)/2,w:580,h:230};S.win=true}
  },
};
const SUM={ratR:Y=>'Ratio of '+Y.R+': '+Y.rp+':'+Y.rq,ratC:Y=>'Constants: '+Y.cp+':'+Y.cq,same:Y=>'Compare: '+(Y.ok?'same':'different'),zero:Y=>Y.zero,solve:Y=>Y.R+' = '+Y.val,check:Y=>'Check: ok'};
const HL={ratR:OR,ratC:OR,same:BLUE,zero:OR,solve:OR,check:GR};
const CAP={
  meet:Y=>'Solve **'+fe(Y,1)+'** and **'+fe(Y,2)+'**. This usually takes many steps. Today it takes **one look**. **Watch this.**',
  ratR:Y=>'Look at the **'+Y.R+'** numbers: '+Y.r1+' and '+Y.r2+'. '+(Y.rp===Y.r1?'Their ratio is **'+Y.rp+' : '+Y.rq+'**.':'Their ratio is '+Y.r1+' : '+Y.r2+' = **'+Y.rp+' : '+Y.rq+'**.'),
  ratC:Y=>'Now the numbers on the right: '+Y.c1+' and '+Y.c2+'. '+(Y.cp===Y.c1?'Their ratio is **'+Y.cp+' : '+Y.cq+'**.':'Their ratio is '+Y.c1+' : '+Y.c2+' = **'+Y.cp+' : '+Y.cq+'**.'),
  same:Y=>Y.ok?'**'+Y.rp+' : '+Y.rq+'** and **'+Y.cp+' : '+Y.cq+'** are the **same ratio**! The sutra says: if one is in ratio, **the other is zero**.':'**'+Y.rp+' : '+Y.rq+'** and **'+Y.cp+' : '+Y.cq+'** are **different**. The sutra does not work here. Use another method.',
  nope:Y=>'The **'+Y.R+'** numbers give **'+Y.rp+' : '+Y.rq+'**. The constants give **'+Y.cp+' : '+Y.cq+'**. They are **different**, so the sutra does not work here. Use another method.',
  zero:Y=>'So the other variable, **'+Y.Z+'**, is **0**.',
  solve:Y=>'Put **'+Y.Z+' = 0** in the first equation: **'+Y.r1+Y.R+' = '+Y.c1+'**. So '+Y.R+' = '+Y.c1+' ÷ '+Y.r1+' = **'+Y.val+'**.',
  check:Y=>'Check the second equation: **'+Y.r2+' × '+Y.val+' = '+Y.c2+'**. Solved: **'+Y.Z+' = 0** and **'+Y.R+' = '+Y.val+'**.',
};
const TM={meet:[[0,800,2300],3600],ratR:[[0,800,2300,3800],5100],ratC:[[0,800,2300,3800],5100],same:[[0,800,2300,3800],5100],zero:[[0,800,2300],3600],solve:[[0,800,2300,3800],5100],check:[[0,800,2300,3800],5100],nope:[[0,800,2300,3800,5300],6600],practice:[[0,500],700]};
const E1n='2.3.12',E1m='5.6.24',E2n='4.3.20',E2m='6.7.30',E3n='2.3.12',E3m='5.6.20';
const LIST=[['meet',E1n,E1m,'Meet the problem'],['ratR',E1n,E1m,'Ratio of the y numbers'],['ratC',E1n,E1m,'Ratio of the constants'],['same',E1n,E1m,'Compare the ratios'],['zero',E1n,E1m,'The other is zero'],['solve',E1n,E1m,'Find the other one'],['check',E1n,E1m,'Check the answer'],
['ratR',E2n,E2m,'Another kind: x numbers'],['ratC',E2n,E2m,'Ratio of the constants'],['same',E2n,E2m,'Compare the ratios'],['zero',E2n,E2m,'The other is zero'],['solve',E2n,E2m,'Find the other one'],
['ratR',E3n,E3m,'When it does not work'],['ratC',E3n,E3m,'Ratio of the constants'],['same',E3n,E3m,'Different ratios'],['practice','','','Your turn']];
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Anurupye Shunyamanyat: if one is in ratio, the other is zero';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'3.2.10',m:'7.4.20'},{n:'2.5.8',m:'6.7.24'},{n:'3.4.18',m:'5.8.24'},{n:'5.3.12',m:'2.9.36'},{n:'2.6.18',m:'5.9.27'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const PAIRS=[[1,2],[1,3],[1,4],[2,3],[3,4],[2,5]];
function randomP(){
  const t=Math.random(),[p,q]=pick(PAIRS),gl=Math.ceil(2/p),g=rnd(gl,Math.max(gl,Math.floor(9/q))),r1=g*p,r2=g*q;
  let o1,o2;do{o1=rnd(2,9);o2=rnd(2,9)}while(o1*r2===o2*r1);
  if(t<.2){let c1,c2;do{c1=rnd(6,40);c2=rnd(6,60)}while(c1*r2===c2*r1||c1*o2===c2*o1);return {n:o1+'.'+r1+'.'+c1,m:o2+'.'+r2+'.'+c2}}
  const v=rnd(2,9),c1=r1*v,c2=r2*v;
  return t<.6?{n:o1+'.'+r1+'.'+c1,m:o2+'.'+r2+'.'+c2}:{n:r1+'.'+o1+'.'+c1,m:r2+'.'+o2+'.'+c2};
}
function tasks(Y){
  const T=[
