<style>

<div id="wrap"><div id="cv"></div></div>
<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1800ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: Paravartya Yojayet (transpose and apply), polynomial ÷ (x − a) ---------- */
const fmt=v=>v<0?'−'+(-v):String(v),P=v=>v<0?'('+fmt(v)+')':fmt(v),SUP=['','','²','³','⁴'];
function poly(c){const d=c.length-1;let s='';c.forEach((v,i)=>{if(!v)return;const p=d-i,a=Math.abs(v),t=(a===1&&p>0?'':a)+(p>0?'x'+SUP[p]:'');s+=s?(v<0?' − ':' + ')+t:(v<0?'−':'')+t});return s||'0'}
function yav(n,m){
  n=String(n);m=String(m);const c=n.split(',').map(Number),h=+m,L=c.length,q=[c[0]],p=[null];
  for(let i=1;i<L;i++){p.push(q[i-1]*h);q.push(c[i]+p[i])}
  const quo=q.slice(0,L-1),rem=q[L-1],dv='x '+(h<0?'+ '+(-h):'− '+h);
  let ok=true;{let r=0;for(const v of c)r=r*h+v;ok=r===rem}
  return {n,m,c,h,L,q,p,quo,rem,dv,prob:'('+poly(c)+') ÷ ('+dv+')',ans:poly(quo),ok};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const OX=870,colOf=()=>BLUE,RX=720,BAR=645;
const CX=(Y,i)=>i===Y.L-1?RX:570-(Y.L-2-i)*120;
function badge(S,Y,on,val=Y.h,y=300,x=OX){
  S.box('ob',x,y,96,84,{shadow:true,r:20,o:on?1:0,c:'#ffb979',fill:'#fff4e8'});
  S.el('os',typeof val==='number'?(val>0?'+'+val:fmt(val)):val,x,y,{z:46,c:OR,o:on?1:0});
  S.el('oL','helper',x,y-64,{z:17,c:OR,w:800,o:on?1:0});
  S.el('oD','from '+Y.dv,x,y+62,{z:15,c:MU,w:700,o:on?1:0});
}
function grid(S,Y,o={},dy=0){
  const {down=0,prod=0,lab=false,on=1}=o,L=Y.L;
  for(let i=0;i<L;i++){const x=CX(Y,i);
    S.el('l'+i,i===L-1?'1':'x'+SUP[L-1-i],x,180+dy,{z:18,c:MU,w:800,o:on});
    S.el('c'+i,fmt(Y.c[i]),x,225+dy,{z:52,o:on});
    if(i)S.el('p'+i,fmt(Y.p[i]),x,292+dy,{z:52,s:.72,c:OR,o:i<=prod?1:0});
    S.el('q'+i,fmt(Y.q[i]),x,i<down?395+dy:225+dy,{z:52,c:i===L-1?GR:BLUE,o:i<down?1:0});
    S.el('a'+i,i===L-1?'remainder':(L-2-i?'x'+SUP[L-2-i]:'1'),x,447+dy,{z:16,c:MU,w:800,o:lab?1:0});
  }
  S.box('ln',(CX(Y,0)+RX)/2,340+dy,RX-CX(Y,0)+120,3,{fill:'#c9d3df',c:'#c9d3df',r:2,o:on});
  S.box('rb',BAR,300+dy,4,300,{fill:'#c9d3df',c:'#c9d3df',r:2,o:on});
}
function mulStep(S,Y,ph,k){
  grid(S,Y,{down:k,prod:ph>=4?k:k-1});badge(S,Y,true);S.el('pb',Y.prob,512,118,{z:28,c:INK,w:800});
  const b=ph>=2&&ph<4?bub(S,[{id:'m0',t:fmt(Y.q[k-1]),c:BLUE},{id:'m1',t:'×',op:1,c:MU},{id:'m2',t:P(Y.h),c:OR},{id:'m3',t:'=',op:1,c:MU},{id:'p'+k,t:fmt(Y.p[k]),res:1,c:OR}],1,1,ph>=3?1:0):null;
  if(b)S.mod('p'+k,{z:52,s:1});
  if(ph===0){S.f('q'+(k-1));S.h('q'+(k-1))}
  if(ph===1){S.f('q'+(k-1),'os');S.h('os')}
  if(ph===2){S.f('bub',b.rest)}
  if(ph===3){S.f('bub',b.ids);S.h('p'+k)}
  if(ph>=4){S.f('p'+k,'c'+k);S.h('p'+k)}
}
function addStep(S,Y,ph,k){
  grid(S,Y,{down:ph>=4?k+1:k,prod:k});badge(S,Y,true);S.el('pb',Y.prob,512,118,{z:28,c:INK,w:800});
  const last=k===Y.L-1;
  const b=ph>=2&&ph<4?bub(S,[{id:'s0',t:fmt(Y.c[k])},{id:'s1',t:'+',op:1,c:MU},{id:'s2',t:P(Y.p[k]),c:OR},{id:'s3',t:'=',op:1,c:MU},{id:'q'+k,t:fmt(Y.q[k]),res:1,c:last?GR:BLUE}],1,1,ph>=3?1:0):null;
  if(ph===0){S.f('c'+k);S.h('c'+k)}
  if(ph===1){S.f('c'+k,'p'+k);S.h('p'+k)}
  if(ph===2){S.f('bub',b.rest)}
  if(ph===3){S.f('bub',b.ids);S.h('q'+k)}
  if(ph>=4){S.f('q'+k);S.h('q'+k)}
}
const ST={
  idea(S,Y,ph){
    S.el('dvx',Y.dv,512,250,{z:64});
    badge(S,Y,ph>=1,Y.h,420,512);S.mod('ob',{s:1.2});S.mod('oL',{y:420-88,z:20});S.mod('oD',{o:0});
    if(ph>=1)S.f('dvx','ob','os','oL');
  },
  meet(S,Y,ph){
    S.el('pb',Y.prob,512,ph>=1?118:260,{z:ph>=1?28:40,c:INK,w:800});badge(S,Y,true);
    grid(S,Y,{on:ph>=1?1:0});if(ph>=1)S.f(Array.from({length:Y.L},(_,i)=>['c'+i,'l'+i]).flat(),'rb','ln');
  },
  down(S,Y,ph){
    grid(S,Y,{down:ph>=1?1:0});badge(S,Y,true);S.el('pb',Y.prob,512,118,{z:28,c:INK,w:800});
    S.mod('q0',{o:1});S.f('c0','q0');S.h(ph>=1?'q0':'c0');
  },
  read(S,Y,ph){
    if(ph>=2){S.el('e1',Y.prob,512,250,{z:28,c:MU,w:800});
      S.el('e3','= '+Y.ans+(Y.rem?', remainder '+fmt(Y.rem):''),512,330,{z:44,c:GR});S.f('e1','e3');S.finale={x:512,y:295,w:Math.min(820,Math.max(560,Y.prob.length*17+80)),h:200};S.win=true;return}
    grid(S,Y,{down:Y.L,prod:Y.L-1,lab:ph>=1});badge(S,Y,true);S.el('pb',Y.prob,512,118,{z:28,c:INK,w:800});
    S.f(Array.from({length:Y.L},(_,i)=>['q'+i,'a'+i]).flat());
  },
  setup2(S,Y,ph){
    S.el('pb',Y.prob,512,118,{z:28,c:INK,w:800});badge(S,Y,true);grid(S,Y,{down:ph>=1?1:0});
    if(ph===0){S.f('pb','ob','os','oL','oD')}else{S.f('c0','q0');S.h('q0')}
  },
  fast(S,Y,ph){
    const k=Math.max(1,Math.min(ph,Y.L-1));S.el('pb',Y.prob,512,118,{z:28,c:INK,w:800});badge(S,Y,true);
    grid(S,Y,{down:ph>=1?k+1:1,prod:ph>=1?k:0});
    if(ph>=1){const its=[{t:fmt(Y.q[k-1]),c:BLUE},{t:'×',op:1,c:MU},{t:P(Y.h),c:OR},{t:'=',op:1,c:MU},{t:fmt(Y.p[k]),c:OR},{t:'→',op:1,c:MU,g:30},{t:fmt(Y.c[k])},{t:'+',op:1,c:MU},{t:P(Y.p[k]),c:OR},{t:'=',op:1,c:MU},{t:fmt(Y.q[k]),c:k===Y.L-1?GR:BLUE}].map((x,i)=>({...x,id:'w'+ph+'_'+i}));
      bub(S,its,1,1,1);S.mod('bub',{w:Math.min(860,S.B[Object.keys(S.B).find(x=>x.endsWith('.bub'))].w)});S.f('bub',its.map(x=>x.id),'p'+k,'q'+k)}
    else S.f('q0');
  },
};
[1,2,3].forEach(k=>{ST['m'+k]=(S,Y,ph)=>mulStep(S,Y,ph,k);ST['a'+k]=(S,Y,ph)=>addStep(S,Y,ph,k)});
function eq(S,Y,y,col){S.el('e1',Y.prob,512,y-40,{z:24,c:MU,w:800});S.el('e3','= '+Y.ans+(Y.rem?', remainder '+fmt(Y.rem):''),512,y+22,{z:40,c:col});return ['e1','e3']}
const SUM={idea:Y=>'Helper: '+(Y.h>0?'+':'')+fmt(Y.h),down:Y=>'Bring down: '+fmt(Y.q[0])};
[1,2,3].forEach(k=>SUM['a'+k]=Y=>(k===Y.L-1?'Remainder: ':'Next number: ')+fmt(Y.q[k]));
const HL={idea:OR,down:BLUE,a1:BLUE,a2:BLUE,a3:BLUE};
const CAP={
  idea:Y=>'We divide by **'+Y.dv+'**. Flip the sign: the **helper** is **'+(Y.h>0?'+':'')+fmt(Y.h)+'**. We use it all lesson.',
  meet:Y=>'Write just the numbers: **'+Y.c.map(fmt).join(', ')+'**. The last one goes in the **remainder** box.',
  down:Y=>'Bring the first number **'+fmt(Y.c[0])+'** straight down.',
  read:Y=>'Read the bottom row: **'+Y.ans+'**'+(Y.rem?', remainder **'+fmt(Y.rem)+'**.':', remainder **0**.'),
  setup2:Y=>'Now divide by **'+Y.dv+'**. Flip the sign: helper **'+fmt(Y.h)+'**. Bring down **'+fmt(Y.c[0])+'**.',
  fast:Y=>'Same moves: multiply by the helper, write it below, add.',
};
[1,2,3].forEach(k=>{CAP['m'+k]=Y=>'Multiply by the helper: **'+fmt(Y.q[k-1])+' × '+P(Y.h)+' = '+fmt(Y.p[k])+'**. Write it under the next number.';
  CAP['a'+k]=Y=>'Add down the column: **'+fmt(Y.c[k])+' + '+P(Y.p[k])+' = '+fmt(Y.q[k])+'**.'+(k===Y.L-1?' That’s the **remainder**.':'')});
const ST5=[[0,1200,2400,3600,4800],6200];
const TM={idea:[[0,1200],3200],meet:[[0,1200],3200],down:[[0,1400],3000],m1:ST5,m2:ST5,m3:ST5,a1:ST5,a2:ST5,a3:ST5,read:[[0,1400,2800],4600],setup2:[[0,1600],3400],fast:[[0,2000,4200,6400],8400],practice:[[0,500],700]};
new Set(Object.values(TM)).forEach(v=>{if(v===TM.practice)return;v[0]=v[0].map(t=>Math.round(t*1.5));v[1]=Math.round(v[1]*1.5)});
const E1='1,3,-4,-12',E1m='2',E2='2,3,-5,4',E2m='-2';
const LIST=[['idea',E1,E1m,'The helper'],['meet',E1,E1m,'Write the numbers'],['down',E1,E1m,'Bring down'],
['m1',E1,E1m,'Column 2: multiply'],['a1',E1,E1m,'Column 2: add'],['m2',E1,E1m,'Column 3: multiply'],['a2',E1,E1m,'Column 3: add'],['m3',E1,E1m,'Last column: multiply'],['a3',E1,E1m,'Last column: add'],['read',E1,E1m,'The answer'],
['setup2',E2,E2m,'Try ÷ (x + 2)'],['fast',E2,E2m,'All columns'],['read',E2,E2m,'The answer'],['practice','','','Your turn']];
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Paravartya Yojayet: transpose and apply';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'1,3,5',m:'2'},{n:'1,2,1,3',m:'1'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomP(){const L=rnd(3,4),c=[1];for(let i=1;i<L;i++)c.push(rnd(1,6));return {n:c.join(','),m:String(rnd(1,3))}}
function tasks(Y){
  const T=[{ty:'h',cap:'We divide by **'+Y.dv+'**. What is the **helper**?',ok:'helper +'+Y.h,ans:String(Y.h),g:'idea',hint:'Close! Flip the sign of '+fmt(-Y.h)+'.'}];
  for(let k=1;k<Y.L;k++){
    T.push({ty:'m',k,cap:'Multiply: **'+Y.q[k-1]+' × '+Y.h+'** = ?',ok:Y.q[k-1]+' × '+Y.h+' = '+Y.p[k],ans:String(Y.p[k]),g:'m1',hint:'Close! Bottom number × helper.'});
    T.push({ty:'a',k,cap:'Add: **'+Y.c[k]+' + '+Y.p[k]+'** = ?',ok:Y.c[k]+' + '+Y.p[k]+' = '+Y.q[k],ans:String(Y.q[k]),g:'a1',hint:'Close! Add down the column.'});
  }
  return T;
}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,fin=pr.done||(pr.ok&&t===T.length-1),c=T[t];
  if(fin){const ids=eq(S,Y,260,GR);S.finale={x:512,y:255,w:Math.min(820,Math.max(560,Y.prob.length*15+80)),h:170};return}
  const D=-62;badge(S,Y,true,t>0||pr.ok?Y.h:'?',238);
  if(c.ty==='h'){grid(S,Y,{down:0},D);return}
  const k=c.k;
  if(c.ty==='m'){grid(S,Y,{down:k,prod:pr.ok?k:k-1},D);S.mod('q'+(k-1),{c:BLUE});if(!pr.ok)S.h(pulse?'os':'q'+(k-1))}
  else{grid(S,Y,{down:pr.ok?k+1:k,prod:k},D);if(!pr.ok)S.h(pulse?'p'+k:'c'+k)}
}
let pulse=0;setInterval(()=>{if(st.step===LAST&&st.phase>=1&&st.pr&&!st.pr.done&&!st.pr.replay&&!st.pr.ok){pulse^=1;render()}},3400);
let bad=[];
for(let i=0;i<2000;i++){const L=rnd(3,5),c=[];for(let j=0;j<L;j++)c.push(rnd(-9,9));c[0]=c[0]||1;const h=rnd(-5,5)||1;if(!yav(c.join(','),String(h)).ok)bad.push(c+'/'+h)}
PRACTICE.forEach(p=>{const Y=yav(p.n,p.m);if(Y.q.some(v=>v<0)||Y.p.some(v=>v<0))bad.push(p.n)});
console.log(bad.length?'[Vedica] paravartya tests FAILED '+bad.slice(0,4).join(' | '):'[Vedica] paravartya checked against the remainder theorem on 2,000 divisions');

/* ---------- chrome ---------- */
const cv=document.getElementById('cv');
cv.innerHTML=`
<div class="abs" style="top:22px;left:36px;right:36px;height:40px;display:flex;align-items:center;justify-content:space-between;z-index:7">
 <div class="nun" style="display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.03em"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#0a84ff;color:#fff;font-size:16px;font-style:italic;box-shadow:0 5px 12px rgba(10,132,255,.22)">V</span>Vedica</div>
 <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600"><span style="color:#8391a6">Algebraic division</span><span style="color:#d3dbe4">·</span><span id="sn" style="color:#0a84ff;font-weight:700"></span><span id="sm" style="color:#8290a5"></span></div>
 <button id="x" class="rb" aria-label="Exit lesson" title="Exit lesson" style="width:40px;height:40px"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
<div id="pg" class="abs" style="top:62px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5"></div>
<div id="fin" class="abs" style="left:0;top:0"></div><div id="spot" class="abs" style="left:0;top:0;pointer-events:none"></div>
<div id="bl"></div>
