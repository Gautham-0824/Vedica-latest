<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1300ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: Urdhva-Tiryagbhyam (vertically and crosswise), 3-digit × 3-digit ---------- */
const sg=v=>v<0?'−':'+',ab=Math.abs,fmt=v=>v<0?'−'+(-v):String(v);
const PAIRS=[1,2,3,4,5].map(k=>{const s=5-k,p=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(i+j===s)p.push([i,j]);return p});
function yav(n,m){
  if(n==='abc')return {n,m,A:['a','b','c'],B:['d','e','f'],raw:['cf','bf+ce','af+be+cd','ae+bd','ad'],pairs:PAIRS,cin:['x','x','x','x','x'],ans:'',ok:true};
  const A=n.split('').map(Number),B=m.split('').map(Number),raw=PAIRS.map(ps=>ps.reduce((t,[i,j])=>t+A[i]*B[j],0));
  const cin=[],dig=[];let c=0,lead=0;
  raw.forEach((v,k)=>{cin[k]=c;const t=v+c;if(k<4){dig.unshift(t%10);c=(t-t%10)/10}else lead=t});
  const ans=String(lead)+dig.join('');
  return {n,m,A,B,raw,pairs:PAIRS,cin,ans,ok:ans===String(+n*+m)};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const P=[264,388,512,636,760],UY=125,LY=250,CY=400,AY=596,LET='abc',DIG=['ua','ub','uc','la','lb','lc'];
const colX=k=>P[4-k],isOp=t=>/^[+×=−÷]$/.test(t),colOf=()=>BLUE;
function base(S,Y,y0,y1,z){
  Y.A.forEach((d,i)=>S.el('u'+LET[i],d,P[2+i],y0,{z}));Y.B.forEach((d,i)=>S.el('l'+LET[i],d,P[2+i],y1,{z}));
  S.el('mx','×',P[1]+8,y1,{z:z*.8,c:MU,w:700});
  S.box('ln',(P[1]+P[4])/2,y1+z*.62,P[4]-P[1]+110,3,{fill:'#c9d3df',c:'#c9d3df',r:2});
}
function cbox(S,Y,k,filled,y,h,val){
  const x=colX(k),s=String(Y.raw[k]),L=s.length;
  S.box('bC'+(k+1),x,y,104,h,{shadow:filled,r:18,dashed:!filled,c:filled?'#e1e8ef':'#c9d3df',fill:filled?'#ffffff':'#fbfcfd'});
  if(val)S.el('vC'+(k+1),s,x,y,{z:L>=8?20:L>=5?26:L===3?36:(h<60?34:40),c:OR,o:filled?1:0});
}
const lab=(S,id,t,x,y,o)=>S.el(id,t,x,y,{z:t.length<=1?44:28,c:BLUE,w:800,o});
const adIds=Y=>Y.ans.split('').map((_,i)=>'ad'+i);
function ansRow(S,Y,y,o){return seq(S,Y.ans.split('').map((d,i)=>({id:'ad'+i,t:d,o})),512,y,56)}
function eq(S,Y,y,col){
  const items=[{id:'rn',t:Y.n},{id:'rx',t:'×',op:1,c:MU},{id:'rm',t:Y.m},{id:'rq',t:'=',op:1,c:MU}].concat(Y.ans.split('').map((d,i)=>({id:'ad'+i,t:d})));
  items.forEach(i=>{if(!i.op)i.c=col});seq(S,items,512,y,56);return items.map(i=>i.id);
}
function arrows(S,Y,k){const src=[];Y.pairs[k].forEach(([i,j],n)=>{src.push('u'+LET[i],'l'+LET[j]);S.arrow(n,[P[2+i],UY+36],[P[2+j],LY-36],{bend:0})});src.forEach(id=>S.mod(id,{c:BLUE}));return src}
function srcOf(Y,k){const src=[];Y.pairs[k].forEach(([i,j])=>src.push('u'+LET[i],'l'+LET[j]));return src}
function colStage(S,Y,ph,k){
  base(S,Y,UY,LY,56);
  for(let i=0;i<5;i++)cbox(S,Y,i,i<k||(i===k&&ph>=3),CY,70,i<k);
  const T=[];Y.pairs[k].forEach(([i,j],n)=>{if(n)T.push('+');T.push(Y.A[i],'×',Y.B[j])});T.push('=');
  const vid='vC'+(k+1),items=T.map((t,i)=>({id:'c'+i,t:String(t),op:isOp(String(t)),c:INK})).concat({id:vid,t:String(Y.raw[k]),res:true,c:OR});
  const b=bub(S,items,ph>=1?1:0,ph>=1?1:0,ph>=2?1:0),src=srcOf(Y,k);
  if(ph<3)arrows(S,Y,k);
  if(ph===0){S.f(src);S.h(src[0])}
  if(ph===1){S.f(src,'bub',b.rest);S.h('c1')}
  if(ph===2){S.f('bub',b.res);S.h(vid)}
  if(ph>=3){b.rest.forEach(id=>S.mod(id,{o:0}));S.mod('bub',{o:0,s:.9});S.mod(vid,{x:colX(k),y:CY,s:40/52,o:1});S.f('bC'+(k+1),vid);S.h(vid)}
}
function colsS(S,Y,ph){
  base(S,Y,UY,LY,56);
  for(let k=0;k<5;k++)cbox(S,Y,k,ph>=k+1,CY,70,true);
  if(ph===0){S.f(DIG)}
  else if(ph<=5){const k=ph-1;arrows(S,Y,k);S.f(srcOf(Y,k),'bC'+(k+1),'vC'+(k+1));S.h('vC'+(k+1))}
}
function carryS(S,Y,ph){
  base(S,Y,UY,LY,56);for(let k=0;k<5;k++)cbox(S,Y,k,true,CY,70,true);
  const fs=[];let n=0;
  for(let k=0;k<4;k++){const c=Y.cin[k+1];if(c){const x0=colX(k),x1=colX(k+1);lab(S,'cl'+n,typeof c==='number'?'carry '+c:'carry',(x0+x1)/2,CY-96,ph>=1?1:0);if(ph>=1)S.arrow(n,[x0-4,CY-40],[x1+4,CY-40],{bend:.35});fs.push('cl'+n);n++}}
  if(Y.ans)ansRow(S,Y,AY,ph>=2?1:0);
  const bxs=[0,1,2,3,4].map(k=>'bC'+(k+1)),vs=[0,1,2,3,4].map(k=>'vC'+(k+1));
  if(ph===0){S.f(bxs,vs);S.h('vC1')}
  if(ph===1){S.f(vs,fs);S.h(fs.length?fs[0]:'vC1')}
  if(ph>=2&&Y.ans){S.f(adIds(Y));S.h('ad'+(Y.ans.length-1))}
  else if(ph>=2){S.f(vs)}
}
const ST={
  meet(S,Y,ph){
    base(S,Y,UY,LY,56);if(ph===0)S.hide(DIG.concat('mx'));
    for(let k=0;k<5;k++)cbox(S,Y,k,false,CY,70,false);
    if(ph>=2){S.f(DIG,[0,1,2,3,4].map(k=>'bC'+(k+1)))}
  },
  result(S,Y,ph){
    if(ph===0){base(S,Y,UY,LY,56);for(let k=0;k<5;k++)cbox(S,Y,k,true,CY,70,true);ansRow(S,Y,AY,1);S.f(adIds(Y));S.h('ad0');return}
    const ids=eq(S,Y,300,ph>=3?GR:INK);
    if(ph===1)S.h('rm');if(ph>=2){S.f(ids);S.h('ad0')}
    if(ph>=3){S.finale={x:512,y:300,w:780,h:170};S.win=true}
  },
};
[0,1,2,3,4].forEach(k=>ST['c'+(k+1)]=(S,Y,ph)=>colStage(S,Y,ph,k));
ST.cols=colsS;ST.p1=colsS;ST.carry=carryS;ST.p2=carryS;
const SUM={carry:Y=>'Answer: '+Y.ans,cols:Y=>'5 columns done'};
const SN=['Last pair','Last two','All three','First two','First pair'];
[0,1,2,3,4].forEach(k=>SUM['c'+(k+1)]=Y=>SN[k]+': '+Y.raw[k]);
const HL={c1:OR,c2:OR,c3:OR,c4:OR,c5:OR,cols:OR,carry:GR};
const NUMW=['','one','two','three'],ex=(Y,k)=>Y.pairs[k].map(([i,j])=>Y.A[i]+' × '+Y.B[j]).join(' + ');
const colCap=k=>Y=>'Column '+(k+1)+': '+NUMW[Y.pairs[k].length]+' pair'+(Y.pairs[k].length>1?'s, then **+**':'')+'. **'+ex(Y,k)+' = '+Y.raw[k]+'**.';
const carryCap=Y=>'Work from the right. Keep the **last digit** of each column and carry the rest to the **left**.';
const CAP={
  p1:Y=>'Write the digits as **abc × def**. Make **5 columns**, from the right. Multiply the pairs joined by arrows, then **+** them.',
  p2:Y=>'Then work from the right: keep the **last digit** of each column and **carry** the rest to the left.',
  meet:Y=>'Multiply **'+Y.n+' × '+Y.m+'** crosswise. Make **5 columns**, from the right. In each, × the pairs joined by arrows, then **+**.',
  cols:Y=>'Same 5 columns from the right: **'+Y.raw.join(', ')+'**.',
  carry:carryCap,
  result:Y=>'So **'+Y.n+' × '+Y.m+' = '+Y.ans+'**.',
};
[0,1,2,3,4].forEach(k=>CAP['c'+(k+1)]=colCap(k));
const S4=[[0,700,2200,3700],5300],SC=[[0,800,2400,4000,5600,7200],9000];
const TM={meet:[[0,700,2200],3600],cols:SC,p1:SC,carry:[[0,700,2300,3900],5800],result:[[0,800,2400,4000],6000],practice:[[0,500],700]};
TM.p2=TM.carry;[0,1,2,3,4].forEach(k=>TM['c'+(k+1)]=S4);
const E1='123',E1m='132',E2='312',E2m='245',M='';
const LIST=[['meet',E1,E1m,'Meet the problem'],
['c1',E1,E1m,'Column 1'],['c2',E1,E1m,'Column 2'],['c3',E1,E1m,'Column 3'],['c4',E1,E1m,'Column 4'],['c5',E1,E1m,'Column 5'],['carry',E1,E1m,'Carry'],['result',E1,E1m,'The result'],
['cols',E2,E2m,'Try 312 × 245: columns'],['carry',E2,E2m,'Carry'],['result',E2,E2m,'The result'],['practice','','','Your turn']];
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Urdhva-Tiryagbhyam: vertically and crosswise';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'213',m:'124'},{n:'241',m:'312'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomP(){const d=()=>rnd(1,5)+''+rnd(1,5)+rnd(1,5);return {n:d(),m:d()}}
function tasks(Y){
  const T=[0,1,2,3,4].map(k=>({cap:'Column '+(k+1)+': **'+ex(Y,k)+'**.',q:'column '+(k+1),ok:ex(Y,k)+' = '+Y.raw[k],ans:String(Y.raw[k]),
    ex:Y.pairs[k].reduce((a,[i,j],n)=>a.concat(n?['+']:[],[Y.A[i],'×',Y.B[j]]),[]),g:'c'+(k+1),hint:'Close! × each pair, then + them.'}));
  const r=Y.raw.slice().reverse();
  T.push({cap:'The columns are **'+r.join(' · ')+'**. Keep the last digit of each, carry the rest, and type the answer.',q:'answer',ok:Y.n+' × '+Y.m+' = '+Y.ans,ans:Y.ans,ex:r.reduce((a,v,n)=>a.concat(n?['·']:[],[v]),[]),g:'carry',hint:'Close! Start from the right. Keep one digit, carry the rest.'});
  return T;
}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,fin=pr.done||(pr.ok&&t===T.length-1);
  if(fin){eq(S,Y,260,GR);S.finale={x:512,y:260,w:780,h:160};return}
  base(S,Y,118,182,46);
  for(let k=0;k<5;k++)cbox(S,Y,k,k<t,285,56,k<t);
  if(t<5)srcOf(Y,t).forEach(id=>S.mod(id,{c:BLUE}));
  const e=T[t].ex,ids2=e.map((_,i)=>'te'+t+'_'+i),q=seq(S,e.map((x,i)=>({id:ids2[i],t:String(x),op:i%2===1})),512,402,46);
  S.box('tb'+t,512,402,Math.max(240,q.total+90),68,{shadow:true,r:26});
}
let bad=[];
for(let i=0;i<4000;i++){const n=''+rnd(1,9)+rnd(0,9)+rnd(0,9),m=''+rnd(1,9)+rnd(0,9)+rnd(0,9),Y=yav(n,m);if(!Y.ok)bad.push(n+'x'+m)}
PRACTICE.concat([{n:E1,m:E1m},{n:E2,m:E2m}]).forEach(p=>{if(!yav(p.n,p.m).ok)bad.push(p.n+'x'+p.m)});
console.log(bad.length?'[Vedica] 3x3 crosswise tests FAILED '+bad.length:'[Vedica] crosswise 3 x 3 verified on 4,000 products');

/* ---------- chrome ---------- */
const cv=document.getElementById('cv');
cv.innerHTML=`
<div class="abs" style="top:22px;left:36px;right:36px;height:40px;display:flex;align-items:center;justify-content:space-between;z-index:7">
 <div class="nun" style="display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.03em"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#0a84ff;color:#fff;font-size:16px;font-style:italic;box-shadow:0 5px 12px rgba(10,132,255,.22)">V</span>Vedica</div>
 <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600"><span style="color:#8391a6">3-digit × 3-digit</span><span style="color:#d3dbe4">·</span><span id="sn" style="color:#0a84ff;font-weight:700"></span><span id="sm" style="color:#8290a5"></span></div>
 <button id="x" class="rb" aria-label="Exit lesson" title="Exit lesson" style="width:40px;height:40px"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
<div id="pg" class="abs" style="top:62px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5"></div>

<div id="bl"></div>
<svg class="abs" width="1024" height="768" viewBox="0 0 1024 768" style="left:0;top:0;pointer-events:none;overflow:visible"><path id="a0"/><path id="a1"/><path id="a2"/><path id="a3"/></svg>
<div id="nl"></div>

  });

  // captions, practice
  const pr=st.pr||freshPr(),prac=st.step===LAST&&st.phase>=1,Y=prac?yav(cur().n,cur().m):null;let capStr,hl=BLUE;

    f.style.width=w+'%';f.style.transition=tr});

  const col=pr.ok?GR:pr.bad?OR:BLUE;

  Object.assign(nx.style,{width:(exp?124:56)+'px',gap:exp?'6px':'0',background:exp?BLUE:'#e7f1fd',color:exp?'#fff':BLUE,boxShadow:exp?'0 10px 24px rgba(10,132,255,.3)':'none'});

  [...mn.querySelectorAll('button')].forEach(b=>{const s=b.dataset.l===st.lang;b.style.background=s?'#eaf3ff':'transparent';b.style.color=s?BLUE:INK;b.lastChild.style.opacity=s?1:0});
  if(st.audio&&st.capIn&&capNow!==spoken)speak();
}
function fit(){const k=Math.min(innerWidth/1024,innerHeight/768);$('cv').style.transform='scale('+k+')'}

addEventListener('keydown',e=>{

});

fit();
// Resume: every step is saved, and an unfinished lesson reopens at the step it was left on.
(function(){var K='vedica-resume',id=window.__vdLesson||location.pathname.split('/').pop(),g=go,sv;
go=function(s,o){try{var r=JSON.parse(localStorage.getItem(K)||'{}');r[id]=s;localStorage.setItem(K,JSON.stringify(r))}catch(e){}return g(s,o)};
try{sv=JSON.parse(localStorage.getItem(K)||'{}')[id]}catch(e){}
