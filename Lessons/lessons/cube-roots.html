<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1300ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: cube root of a perfect cube (2-digit root), by observation ---------- */
const CUBE=[0,1,8,27,64,125,216,343,512,729,1000],END=[0,1,8,7,4,5,6,3,2,9];
function yav(n){
  const s=String(n),fr=s.slice(0,-3),bk=s.slice(-3),F=+fr,ld=+s.slice(-1),u=END[ld];let t=1;while(CUBE[t+1]<=F)t++;
  const ans=String(t*10+u);return {n:s,m:'',fr,bk,F,ld,u,t,lo:CUBE[t],hi:CUBE[t+1],ans,ok:(t*10+u)**3===+s};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const NY=190,NZ=88,CY=370,RZ=56,colOf=()=>BLUE;
function numXs(Y,split,z){const L=Y.n.length,nf=Y.fr.length,dw=z*.6,g=z*.1,sg=z*1.1;
  const tot=L*dw+(L-1)*g+(split?sg-g:0);let x=512-tot/2+dw/2;const xs=[];
  for(let i=0;i<L;i++){xs.push(x);x+=dw+(split&&i===nf-1?sg:g)}return xs}
function num(S,Y,split,y=NY,z=NZ){
  const xs=numXs(Y,split,z),nf=Y.fr.length;
  Y.n.split('').forEach((d,i)=>S.el('d'+i,d,xs[i],y,{z}));
  S.box('dv',(xs[nf-1]+xs[nf])/2,y,4,z*.9,{fill:'#c9d3df',c:'#c9d3df',r:2,o:split?1:0});
  return {xs,fx:(xs[0]+xs[nf-1])/2,lx:xs[xs.length-1],bx:(xs[nf]+xs[xs.length-1])/2,
    fids:Y.fr.split('').map((_,i)=>'d'+i),bids:Y.bk.split('').map((_,i)=>'d'+(nf+i)),lid:'d'+(xs.length-1)};
}
function root(S,Y,N,fT,fU,y=CY,h=84,z=RZ){
  [['T',N.fx,fT,Y.t,'first digit'],['U',N.lx,fU,Y.u,'last digit']].forEach(([k,x,f,v,l])=>{
    S.box('b'+k,x,y,96,h,{shadow:f,r:20,dashed:!f,c:f?'#e1e8ef':'#c9d3df',fill:f?'#ffffff':'#fbfcfd'});
    S.el('v'+k,v,x,y,{z,c:OR,o:f?1:0});
    S.el('l'+k,l,x,y+h/2+22,{z:17,c:MU,w:700});
  });
}
function eq(S,Y,y,col){
  const items=[{id:'rr',t:'∛',op:1,c:MU},{id:'rn',t:Y.n},{id:'rq',t:'=',op:1,c:MU},{id:'vT',t:Y.t},{id:'vU',t:Y.u}];
  items.forEach(i=>{if(!i.op)i.c=col});seq(S,items,512,y,56);return items.map(i=>i.id);
}
function stage(S,Y,ph,items,vid,bx,src,from){
  const b=bub(S,items,ph>=1?1:0,ph>=1?1:0,ph>=2?1:0);
  src.forEach(id=>S.mod(id,{c:BLUE}));
  if(ph<3)S.arrow(0,[from,NY+50],[bx,CY-50],{bend:0});
  if(ph===0){S.f(src);S.h(src[src.length-1])}
  if(ph===1){S.f(src,'bub',b.rest)}
  if(ph===2){S.f('bub',b.res);S.h(vid)}
  if(ph>=3){b.rest.forEach(id=>S.mod(id,{o:0}));S.mod('bub',{o:0,s:.9});S.mod(vid,{x:bx,y:CY,s:RZ/52,o:1});S.f('b'+vid.slice(1),vid);S.h(vid)}
}
const ST={
  meet(S,Y,ph){
    const N=num(S,Y,false);if(ph===0)S.hide(N.xs.map((_,i)=>'d'+i));root(S,Y,N,false,false);
    if(ph<2)['bT','bU','lT','lU'].forEach(id=>S.mod(id,{o:0}));else S.f(N.fids,N.bids,'bT','bU','lT','lU');
  },
  split(S,Y,ph){
    const N=num(S,Y,ph>=1);root(S,Y,N,false,false);
    S.el('gF','front',N.fx,NY-76,{z:22,c:BLUE,w:800,o:ph>=1?1:0});S.el('gB','last 3',N.bx,NY-76,{z:22,c:BLUE,w:800,o:ph>=1?1:0});
    if(ph===1){S.f(N.bids,'gB','dv');S.h(N.bids[0])}
    if(ph>=2)S.f(N.fids,N.bids,'gF','gB','dv');
  },
  ends(S,Y,ph){
    const xs=xsOf(9,512,68),SW=[2,3,7,8];
    for(let d=1;d<=9;d++){const x=xs[d-1],sw=SW.includes(d);
      S.box('ec'+d,x,268,58,190,{shadow:true,r:18});
      S.el('et'+d,d,x,212,{z:46});
      S.el('ea'+d,'↓',x,268,{z:22,c:MU,w:700,o:ph>=1?1:0});
      S.el('eb'+d,END[d],x,324,{z:46,c:ph>=2&&sw?OR:BLUE,o:ph>=1?1:0});}
    if(ph>=2)S.f(SW.flatMap(d=>['ec'+d,'et'+d,'ea'+d,'eb'+d]));
  },
  last(S,Y,ph){
    const N=num(S,Y,true);root(S,Y,N,false,ph>=3);
    stage(S,Y,ph,[{id:'q0',t:Y.ld},{id:'q1',t:'→',op:1,c:MU},{id:'vU',t:Y.u,res:1,c:OR}],'vU',N.lx,[N.lid],N.lx);
  },
  front(S,Y,ph){
    const N=num(S,Y,true),t=Y.t;root(S,Y,N,ph>=3,true);
    N.fids.forEach(id=>S.mod(id,{c:BLUE}));
    const ds=[];for(let d=Math.max(1,t-2);d<=Math.min(9,t+2);d++)ds.push(d);
    const xs=xsOf(ds.length+1,512,104),pos={};let k=0;ds.forEach(d=>{pos[d]=xs[k++];if(d===t)pos.mk=xs[k++]});
    const on1=ph>=1?1:0,LY=520;
    ds.forEach(d=>{const hi=ph>=2&&d===t;
      S.box('lb'+d,pos[d],LY,88,64,{shadow:true,r:18,o:on1,c:hi?'#ffd3a8':'#e1e8ef'});
      S.el('lc'+d,CUBE[d],pos[d],LY,{z:32,c:hi?OR:INK,o:on1});
      if(!(ph>=2&&d===t))S.el('ld'+d,d+'³',pos[d],LY+56,{z:20,c:MU,w:800,o:on1})});
    S.el('mk',Y.F,ph>=1?pos.mk:N.fx,ph>=1?LY:NY,{z:ph>=1?34:NZ,c:BLUE,o:on1});
    if(ph===2)S.el('vT',t,pos[t],LY+56,{z:24,c:OR});
    if(ph===0){S.arrow(0,[N.fx,NY+50],[N.fx,CY-50],{bend:0});S.f(N.fids);S.h(N.fids[0])}
    if(ph===1){S.f('mk',ds.flatMap(d=>['lb'+d,'lc'+d,'ld'+d]));S.h('mk')}
    if(ph===2){S.f('mk','lb'+t,'lc'+t,'vT');S.h('vT')}
    if(ph>=3){S.f('bT','vT');S.h('vT')}
  },
  result(S,Y,ph){
    if(ph===0){const N=num(S,Y,true);root(S,Y,N,true,true);S.f('bT','vT','bU','vU');return}
    const ids=eq(S,Y,300,ph>=3?GR:INK);
    if(ph>=2)S.f(ids);
    if(ph>=3){S.finale={x:512,y:300,w:640,h:170};S.win=true}
  },
};
const SUM={split:Y=>'Groups: '+Y.fr+' | '+Y.bk,ends:Y=>'Swap 2↔8, 3↔7',last:Y=>'Last digit: '+Y.u,front:Y=>'First digit: '+Y.t};
const HL={split:BLUE,last:OR,front:OR};
const CAP={
  meet:Y=>'Find the **cube root** of **'+Y.n+'**. The answer has **2 digits**.',
  split:Y=>'Split off the **last 3 digits**: **'+Y.fr+' | '+Y.bk+'**.',
  ends:Y=>'Most digits keep their ending when cubed. Only **2 ↔ 8** and **3 ↔ 7** swap.',
  last:Y=>'It ends in **'+Y.ld+'**, so the root ends in **'+Y.u+'**.'+(Y.ld!==Y.u?' ('+Y.ld+' and '+Y.u+' swap.)':''),
  front:Y=>'**'+Y.F+'** sits between '+Y.lo+' and '+Y.hi+'. Take the smaller one: **'+Y.lo+' = '+Y.t+'³**, so the first digit is **'+Y.t+'**.',
  result:Y=>'So the cube root of **'+Y.n+'** is **'+Y.ans+'**.',
};
const S4=[[0,700,2200,3700],5300];
const TM={meet:[[0,700,2200],3600],split:[[0,700,2200],3600],ends:[[0,700,2400],4200],last:S4,front:S4,result:[[0,800,2400,4000],6000],practice:[[0,500],700]};
const E1='32768',E2='185193';
const LIST=[['meet',E1,'','Meet the problem'],['split',E1,'','Split'],['ends',E1,'','Cube endings'],['last',E1,'','Last digit'],['front',E1,'','First digit'],['result',E1,'','The result'],
['last',E2,'','Try 185193: last digit'],['front',E2,'','First digit'],['result',E2,'','The result'],['practice','','','Your turn']];
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Vilokanam: by observation';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'39304',m:''},{n:'300763',m:''}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomP(){return {n:String(rnd(11,99)**3),m:''}}
function tasks(Y){
  return [
    {cap:'**'+Y.n+'** ends in **'+Y.ld+'**. What does the root end in?',ok:Y.ld+' → '+Y.u,ans:String(Y.u),g:'last',hint:'Close! 2↔8 and 3↔7 swap. The rest stay the same.'},
    {cap:'The front group is **'+Y.fr+'**. Which digit’s cube fits under it?',ok:Y.lo+' ≤ '+Y.F+', so '+Y.t,ans:String(Y.t),g:'front',hint:'Close! Cubes: 1, 8, 27, 64, 125, 216, 343, 512, 729.'},
    {cap:'Put the two digits together. Type the **cube root**.',ok:'∛'+Y.n+' = '+Y.ans,ans:Y.ans,g:'result',hint:'Close! First digit, then last digit.'}];
}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,fin=pr.done||(pr.ok&&t===T.length-1);
  if(fin){eq(S,Y,260,GR);S.finale={x:512,y:260,w:640,h:160};return}
  const N=num(S,Y,true,150,64);
  root(S,Y,N,t>1||(t===1&&pr.ok),t>0||(t===0&&pr.ok),300,70,44);
  if(t===0)S.mod(N.lid,{c:BLUE});if(t===1)N.fids.forEach(id=>S.mod(id,{c:BLUE}));
}
let bad=[];
for(let r=11;r<=99;r++){if(yav(String(r**3)).ans!==String(r))bad.push(r)}
PRACTICE.concat([{n:E1},{n:E2}]).forEach(p=>{if(!yav(p.n).ok)bad.push(p.n)});
console.log(bad.length?'[Vedica] cube root tests FAILED '+bad.join(','):'[Vedica] cube roots verified for 11–99');

 <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600"><span style="color:#8391a6">2-digit cube roots</span><span style="color:#d3dbe4">·</span><span id="sn" style="color:#0a84ff;font-weight:700"></span><span id="sm" style="color:#8290a5"></span></div>

  $('rh').style.opacity=items.length?1:0;

  // captions, practice
  const pr=st.pr||freshPr(),prac=st.step===LAST&&st.phase>=1,Y=prac?yav(cur().n,cur().m):null;let capStr,hl=BLUE;

addEventListener('keydown',e=>{

fit();
// Resume: every step is saved, and an unfinished lesson reopens at the step it was left on.
(function(){var K='vedica-resume',id=window.__vdLesson||location.pathname.split('/').pop(),g=go,sv;
go=function(s,o){try{var r=JSON.parse(localStorage.getItem(K)||'{}');r[id]=s;localStorage.setItem(K,JSON.stringify(r))}catch(e){}return g(s,o)};
