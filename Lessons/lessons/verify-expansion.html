<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1050ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: Gunita Samuccayah on algebra (put x = 1 on both sides) ---------- */
const sg=v=>v<0?'−':'+',ab=Math.abs,fmt=v=>v<0?'−'+(-v):String(v);
function yav(n,m){
  const [p,a,q,b]=n.split('.').map(Number),[A,B,C]=m.split('.').map(Number);
  const sA=p+a,sB=q+b,prod=sA*sB,sR=A+B+C,tA=p*q,tB=p*b+a*q,tC=a*b;
  return {n,m,p,a,q,b,A,B,C,sA,sB,prod,sR,ok:prod===sR,correct:A===tA&&B===tB&&C===tC,truth:(tA===1?'':tA)+'x² '+sg(tB)+' '+(ab(tB)===1?'':ab(tB))+'x '+sg(tC)+' '+ab(tC),v:{A:sA,B:sB,M:prod,R:sR}};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const RY1=235,RY2=325,HY=440,HX={A:300,B:420,M:540,R:700},ORDER=['A','B','M','R'],isOp=t=>/^[+×=−≠]$/.test(t),colOf=()=>BLUE;
const cf=v=>ab(v)===1?'':String(ab(v)),br=(p,a)=>(p===1?'x':p+'x')+' '+sg(a)+' '+ab(a);
const lhs=Y=>'('+br(Y.p,Y.a)+')('+br(Y.q,Y.b)+')',rhs=Y=>cf(Y.A)+'x² '+sg(Y.B)+' '+cf(Y.B)+'x '+sg(Y.C)+' '+ab(Y.C);
const terms=a=>a.map((v,i)=>i?sg(v)+' '+ab(v):String(ab(v))).join(' ');
const tk=a=>a.flatMap((v,i)=>i?[sg(v),String(ab(v))]:[String(ab(v))]);
function rows(S,Y,y1,y2){
  const f=(p,a,d)=>[{id:d+'0',t:'(',g:3},{id:d+'1',t:p===1?'x':p+'x'},{id:d+'2',t:sg(a),op:1,c:MU},{id:d+'3',t:String(ab(a))},{id:d+'4',t:')',g:3}];
  seq(S,f(Y.p,Y.a,'p').concat(f(Y.q,Y.b,'q')),512,y1,62);
  const q2=seq(S,[{id:'r0',t:'=',op:1,c:MU},{id:'r1',t:cf(Y.A)+'x²'},{id:'r2',t:sg(Y.B),op:1,c:MU},{id:'r3',t:cf(Y.B)+'x'},{id:'r4',t:sg(Y.C),op:1,c:MU},{id:'r5',t:String(ab(Y.C))}],512,y2,62);
  return {ids:['p0','p1','p2','p3','p4','q0','q1','q2','q3','q4','r0','r1','r2','r3','r4','r5'],total:q2.total};
}
const SRC={A:['p1','p2','p3'],B:['q1','q2','q3'],R:['r1','r2','r3','r4','r5']};
function hold(S,Y,k,hy){S.box('b'+k,HX[k],hy,80,66,{shadow:true,r:18});S.el('v'+k,fmt(Y.v[k]),HX[k],hy,{z:40,c:OR})}
function stage(S,Y,ph,k){
  const r=rows(S,Y,RY1,RY2);ORDER.slice(0,ORDER.indexOf(k)).forEach(q=>hold(S,Y,q,HY));
  const nums=k==='A'?[Y.p,Y.a]:k==='B'?[Y.q,Y.b]:[Y.A,Y.B,Y.C],T=k==='M'?[fmt(Y.sA),'×',fmt(Y.sB),'=']:tk(nums).concat('=');
  const items=T.map((t,i)=>({id:'c'+i,t,op:isOp(t),c:INK})).concat({id:'v'+k,t:fmt(Y.v[k]),res:true,c:OR});
  const b=bub(S,items,ph>=1?1:0,ph>=1?1:0,ph>=2?1:0),src=k==='M'?['bA','vA','bB','vB']:SRC[k];
  if(k!=='M'&&ph<3)src.forEach(i=>S.mod(i,{c:BLUE}));
  S.box('b'+k,HX[k],HY,80,66,{shadow:true,r:18,o:ph>=3?1:0,s:ph>=3?1:.9});
  if(ph===0){S.f(src);S.h(src[0])}
  if(ph===1){S.f(src,'bub',b.rest);S.h('c1')}
  if(ph===2){S.f('bub',b.res);S.h('v'+k)}
  if(ph>=3){S.mod('v'+k,{x:HX[k],y:HY,s:40/52,o:1});b.rest.forEach(id=>S.mod(id,{o:0}));S.mod('bub',{o:0,s:.9});S.f('b'+k,'v'+k);S.h('v'+k)}
}
const ST={
  meet(S,Y,ph){const r=rows(S,Y,RY1,RY2);if(ph===0)S.hide(r.ids);if(ph>=2){S.f(r.ids.slice(10));S.h('r1');r.ids.slice(10).forEach(i=>S.mod(i,{c:i==='r0'||i==='r2'||i==='r4'?MU:BLUE}))}},
  sumA:(S,Y,ph)=>stage(S,Y,ph,'A'),sumB:(S,Y,ph)=>stage(S,Y,ph,'B'),mul:(S,Y,ph)=>stage(S,Y,ph,'M'),sumR:(S,Y,ph)=>stage(S,Y,ph,'R'),
  cmp(S,Y,ph){
    const r=rows(S,Y,RY1,RY2),col=Y.ok?GR:OR;ORDER.forEach(q=>hold(S,Y,q,HY));
    const b=bub(S,[{id:'k0',t:fmt(Y.prod),c:OR},{id:'k1',t:Y.ok?'=':'≠',op:1,c:col},{id:'k2',t:fmt(Y.sR),c:OR}],ph>=1?1:0,ph>=1?1:0,1);
    const msg=Y.ok?'Match: looks right':'Mismatch: definitely wrong';
    S.box('tag',512,140,Math.max(320,msg.length*15+60),64,{shadow:true,r:22,q:msg,qz:26,qc:col,o:ph>=2?1:0,s:ph>=2?1:.9});
    S.el('hold',Y.ok?'A match means probably right.':'A mismatch always means a mistake.',512,640,{z:26,c:MU,w:800,o:ph>=3?1:0});
    if(ph>=2){S.mod('bM',{c:col});S.mod('bR',{c:col})}
    if(ph>=3){r.ids.forEach(i=>S.mod(i,{c:col}));if(Y.ok)S.win=true}
    if(ph===0){S.f('bM','vM','bR','vR');S.h('vR')}
    if(ph===1){S.f('bub',b.ids);S.h('k1')}
    if(ph>=2){S.f('tag','bM','vM','bR','vR','bub',b.ids,'hold');S.h('k2')}
    if(ph>=3&&Y.ok)S.f('tag','bM','vM','bR','vR','bub',b.ids,'hold',r.ids);
  },
};
const SUM={sumA:Y=>'Bracket 1: '+fmt(Y.sA),sumB:Y=>'Bracket 2: '+fmt(Y.sB),mul:Y=>'Expected: '+fmt(Y.prod),sumR:Y=>'Answer: '+fmt(Y.sR),cmp:Y=>'Check: '+(Y.ok?'Match':'Mismatch')};
const HL={sumA:OR,sumB:OR,mul:OR,sumR:OR,cmp:BLUE};
const CAP={
  meet:Y=>'Is **'+rhs(Y)+'** the right expansion of '+lhs(Y)+'? Check it without redoing the multiplication. **Watch this.**',
  sumA:Y=>'Put **x = 1** in the first bracket. **'+terms([Y.p,Y.a])+' = '+fmt(Y.sA)+'**.',
  sumB:Y=>'Do the same for the second bracket. **'+terms([Y.q,Y.b])+' = '+fmt(Y.sB)+'**.',
  mul:Y=>'Multiply the two results. **'+fmt(Y.sA)+' × '+fmt(Y.sB)+' = '+fmt(Y.prod)+'**. The answer should also give this.',
  sumR:Y=>'Now put **x = 1** in the claimed answer. **'+terms([Y.A,Y.B,Y.C])+' = '+fmt(Y.sR)+'**.',
  cmp:Y=>Y.ok?'**'+fmt(Y.prod)+'** and **'+fmt(Y.sR)+'** match. The expansion looks **right**.':'**'+fmt(Y.prod)+'** and **'+fmt(Y.sR)+'** are different, so it is **definitely wrong**. The real answer is **'+Y.truth+'**.',
};
const TM={meet:[[0,800,2300],3600],sumA:[[0,800,2300,3800],5100],sumB:[[0,800,2300,3800],5100],mul:[[0,800,2300,3800],5100],sumR:[[0,800,2300,3800],5100],cmp:[[0,800,2300,3800],5100],practice:[[0,500],700]};
const E1n='2.3.1.4',E1m='2.11.12',E2m='2.10.12',E3n='1.-2.1.5',E3m='1.3.-10';
const LIST=[['meet',E1n,E1m,'Meet the problem'],['sumA',E1n,E1m,'Put x = 1: bracket 1'],['sumB',E1n,E1m,'Put x = 1: bracket 2'],['mul',E1n,E1m,'Multiply the results'],['sumR',E1n,E1m,'Put x = 1 in the answer'],['cmp',E1n,E1m,'Compare: a match'],
['sumR',E1n,E2m,'A wrong answer'],['cmp',E1n,E2m,'Compare: a mismatch'],
['sumA',E3n,E3m,'With a minus: bracket 1'],['sumB',E3n,E3m,'Bracket 2'],['mul',E3n,E3m,'Multiply the results'],['sumR',E3n,E3m,'Put x = 1 in the answer'],['cmp',E3n,E3m,'Compare: a match'],['practice','','','Your turn']];
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Gunita Samuccayah: put x = 1 on both sides and compare';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'3.2.1.5',m:'3.17.10'},{n:'2.1.3.4',m:'6.10.4'},{n:'3.-1.1.4',m:'3.11.-4'},{n:'1.6.2.3',m:'2.13.18'},{n:'4.-1.2.3',m:'8.10.-3'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomP(){
  for(;;){
    const p=rnd(1,4),q=rnd(1,4),a=rnd(-3,6),b=rnd(-3,6);if(!a||!b||p+a<1||q+b<1)continue;
    const A=p*q,B=p*b+a*q,C=a*b;if(!B||!C)continue;
    let cB=B,cC=C;if(Math.random()<.5){const d=rnd(1,4)*(Math.random()<.5?-1:1);if(Math.random()<.5)cB+=d;else cC+=d}
    if(!cB||!cC||A+cB+cC<1)continue;
    return {n:[p,a,q,b].join('.'),m:[A,cB,cC].join('.')};
  }
}
function tasks(Y){
  const T=[
    {cap:'Put **x = 1** in **('+br(Y.p,Y.a)+')**. Add the numbers.',q:'bracket 1',ok:terms([Y.p,Y.a])+' = '+Y.sA,ans:String(Y.sA),ex:tk([Y.p,Y.a]),g:'sumA',hint:'Close! x counts as 1. Add the numbers in the bracket.'},
    {cap:'Now **('+br(Y.q,Y.b)+')**. Put **x = 1** and add.',q:'bracket 2',ok:terms([Y.q,Y.b])+' = '+Y.sB,ans:String(Y.sB),ex:tk([Y.q,Y.b]),g:'sumB',hint:'Close! x counts as 1. Add the numbers in the bracket.'},
    {cap:'Multiply the two results: **'+Y.sA+' × '+Y.sB+'**.',q:'product',ok:Y.sA+' × '+Y.sB+' = '+Y.prod,ans:String(Y.prod),ex:[Y.sA,'×',Y.sB],g:'mul',hint:'Close! Just multiply the two numbers.'},
    {cap:'Put **x = 1** in the claimed answer **'+rhs(Y)+'**. Add the numbers.',q:'answer',ok:terms([Y.A,Y.B,Y.C])+' = '+Y.sR,ans:String(Y.sR),ex:tk([Y.A,Y.B,Y.C]),g:'sumR',hint:'Close! Add all three numbers. Watch the signs.'},
    {cap:'Compare **'+Y.prod+'** and **'+Y.sR+'**. Type **1** if they match, **0** if they do not.',q:'compare',ok:Y.ok?'They match, so it looks right':'They differ, so it is wrong',ans:Y.ok?'1':'0',ex:[Y.prod,'vs',Y.sR],g:'cmp',hint:'Close! 1 means the two numbers are the same, 0 means they differ.'}];
  return T;
}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,fin=pr.done||(pr.ok&&t===T.length-1),r=rows(S,Y,150,232);
  ORDER.slice(0,fin?4:Math.min(t,4)).forEach(q=>hold(S,Y,q,318));
  if(fin){r.ids.forEach(i=>S.mod(i,{c:Y.ok?GR:OR}));if(Y.ok)S.finale={x:512,y:191,w:700,h:200}}
  else{const g=T[t].g,ex=T[t].ex,ids2=ex.map((_,i)=>'te'+t+'_'+i),q=seq(S,ex.map((x,i)=>({id:ids2[i],t:String(x),op:i===1})),512,400,46);
    S.box('tb'+t,512,400,Math.max(240,q.total+90),84,{shadow:true,r:26});
    (g==='sumA'?SRC.A:g==='sumB'?SRC.B:g==='sumR'?SRC.R:[]).forEach(i=>S.mod(i,{c:BLUE}));S.f(r.ids,'tb'+t,ids2)}
}
let bad=[];PRACTICE.concat([{n:E1n,m:E1m},{n:E1n,m:E2m},{n:E3n,m:E3m}]).forEach(p=>{const Y=yav(p.n,p.m);if(Y.ok!==Y.correct||Y.sR<1&&p.n.indexOf('-1.')<0&&0)bad.push(p)});
for(let i=0;i<5000;i++){const p=randomP(),Y=yav(p.n,p.m);if(Y.ok!==Y.correct||Y.sA<1||Y.sB<1)bad.push(p)}
console.log(bad.length?'[Vedica] x=1 tests FAILED '+bad.length:'[Vedica] x = 1 check verified on 5,000 expansions');

/* ---------- chrome ---------- */
const cv=document.getElementById('cv');
cv.innerHTML=`
<div class="abs" style="top:22px;left:36px;right:36px;height:40px;display:flex;align-items:center;justify-content:space-between;z-index:7">
 <div class="nun" style="display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.03em"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#0a84ff;color:#fff;font-size:16px;font-style:italic;box-shadow:0 5px 12px rgba(10,132,255,.22)">V</span>Vedica</div>
 <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600"><span style="color:#8391a6">Verifying an expansion</span><span style="color:#d3dbe4">·</span><span id="sn" style="color:#0a84ff;font-weight:700"></span><span id="sm" style="color:#8290a5"></span></div>
 <button id="x" class="rb" aria-label="Exit lesson" title="Exit lesson" style="width:40px;height:40px"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
<div id="pg" class="abs" style="top:62px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5"></div>

<div id="bl"></div>
<svg class="abs" width="1024" height="768" viewBox="0 0 1024 768" style="left:0;top:0;pointer-events:none;overflow:visible"><path id="a0"/><path id="a1"/></svg>
<div id="nl"></div>
<div class="abs" style="right:20px;top:216px;width:184px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:none;z-index:2"><div id="rh" style="padding:0 0 2px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8391a6;transition:opacity 300ms">Steps</div><div id="rail" style="display:flex;flex-direction:column;gap:7px"></div></div>
<div id="ringh"></div>
<div id="hand" class="abs" style="left:0;top:0;pointer-events:none;z-index:4"><svg width="66" height="70" viewBox="-30 -18 60 64" style="display:block;overflow:visible;filter:drop-shadow(0 6px 10px rgba(23,35,58,.18))"><path d="M-3 11V-11c0-4 6-4 6 0v11-5c0-4 6-4 6 0v7-4c0-4 6-4 6 0v7-2c0-4 6-4 6 1v8c0 11-7 18-18 18-9 0-14-4-18-11l-6-10c-2-4 3-8 6-4z" style="fill:#fff7ee;stroke:#23324b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/></svg></div>

    const m=c.txt.match(/^(.*(?:= |: ))(.+)$/),d=document.createElement('div');d.dataset.id='r'+c.id;d.setAttribute('role','button');d.title='Replay step '+(c.id+1);
    d.style.cssText='height:36px;max-width:184px;box-sizing:border-box;padding:0 14px 0 7px;pointer-events:auto;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;flex-shrink:0;border-radius:99px;background:#fff;border:1px solid #edf1f5;box-shadow:0 1px 0 rgba(23,35,58,.03),0 6px 16px rgba(23,35,58,.06);transform:translateX(12px) scale(.9);opacity:0';

    d.onclick=()=>go(c.id);rail.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transition='transform '+(rm?0:520)+'ms cubic-bezier(.3,1.3,.5,1),opacity 320ms ease';d.style.transform='none';d.style.opacity=1}));
  });
  $('rh').style.opacity=items.length?1:0;

  // captions, practice
  const pr=st.pr||freshPr(),prac=st.step===LAST&&st.phase>=1,Y=prac?yav(cur().n,cur().m):null;let capStr,hl=BLUE;
  if(st.step<LAST){const d=STEPS[st.step],y=yav(d.n,d.m);capStr=CAP[d.g](y);hl=HL[d.g]||(d.g==='kind'?colOf(y):BLUE)}
  else if(!Y)capStr='Your turn.';
  else if(pr.replay){const d=STEPS[pr.replay.s];capStr=CAP[d.g](Y);hl=HL[d.g]||colOf(Y)}
  else if(pr.done){capStr='**x = 1** is a quick check for any expansion.';hl=GR}
  else{const T=tasks(Y)[pr.task];if(pr.ok){capStr='**Yes!** '+(T.ok||T.q+' = '+T.ans)+'.';hl=GR}else capStr=T.cap}
  capNow=capStr.replace(/\*\*/g,'');
  const cap=$('cap');cap.innerHTML=capStr.split('**').map((t,i)=>t?(i%2?'<span style="color:'+hl+';font-weight:800">'+t+'</span>':'<span>'+t+'</span>'):'').join('');
  Object.assign(cap.style,{opacity:st.capIn?1:0,transform:'translateY('+(st.capIn?0:8)+'px)',filter:st.capIn?'blur(0)':'blur(4px)',transition:st.capIn?'opacity 450ms ease,transform 550ms cubic-bezier(.32,.72,0,1),filter 450ms ease':'none'});
  $('sn').textContent=st.step===LAST?'Practice':'Step '+(st.step+1)+' of '+LAST;$('sm').textContent=STEPS[st.step].name;
  pgBars.forEach((f,i)=>{const s=STEPS[i];let w=0,tr='none';
    if(i<st.step)w=100;else if(i===st.step){if(st.step<LAST){if(st.done){w=100;tr='width 300ms ease'}else if(st.capIn){w=100;tr='width '+s.end+'ms linear'}}else{w=(pr.pi+(pr.done||pr.ok?1:0))/pr.list.length*100;tr='width 600ms cubic-bezier(.32,.72,0,1)'}}
    f.style.width=w+'%';f.style.transition=tr});
  const showP=prac&&!pr.done&&!pr.replay;
  $('pr').style.display=showP?'flex':'none';$('keys').style.display=showP?'flex':'none';$('dn').style.display=prac&&pr.done?'flex':'none';$('tap').style.display=st.step<LAST&&!st.info?'block':'none';
  const col=pr.ok?GR:pr.bad?OR:BLUE;
  Object.assign($('inp').style,{minWidth:'100px',height:'78px',padding:'0 18px',boxSizing:'border-box',borderRadius:'22px',border:'3px solid '+col,background:pr.ok?'#eefaf3':pr.bad?'#fff5eb':'#f4f9ff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'46px',letterSpacing:'.02em',color:pr.input?col:'#b5c3d2',transform:'translateX('+pr.shake+'px) scale('+(pr.ok?1.06:1)+')',transition:'transform 110ms ease,border-color 200ms,background 200ms,color 200ms'});
  $('inp').textContent=pr.input||'?';
  let ht='Use the trick from the lesson.';if(Y&&pr.wrong>0)ht=tasks(Y)[pr.task].hint;if(pr.again)ht='Your turn again.';if(pr.ok)ht='That’s it.';
  $('hint').textContent=ht;$('hint').style.color=pr.wrong&&!pr.ok&&!pr.again?'#a8662a':pr.ok?GR:'#8a97aa';
  $('su').textContent=SUTRA;
  const exp=(st.done&&st.step<LAST)||(st.step===LAST&&false),nx=$('nx');
  Object.assign(nx.style,{width:(exp?124:56)+'px',gap:exp?'6px':'0',background:exp?BLUE:'#e7f1fd',color:exp?'#fff':BLUE,boxShadow:exp?'0 10px 24px rgba(10,132,255,.3)':'none'});
  Object.assign($('nxl').style,{maxWidth:exp?'60px':'0',opacity:exp?1:0});
  $('nxi').setAttribute('d',st.step===LAST?'M20 12a8 8 0 1 1-2.3-5.7M20 5v5h-5':'m9.5 6 6 6-6 6');nx.setAttribute('aria-label',st.step===LAST?'Start the lesson again':'Next step');
  $('bk').style.color=st.step===0?'#c3ccd6':'#3a4860';
  // info, narration menu
  const inf=$('info');inf.style.display=st.info?'grid':'none';inf.style.opacity=st.infoShow?1:0;
  Object.assign($('card').style,{opacity:st.infoShow?1:0,transform:'translateY('+(st.infoShow?0:14)+'px) scale('+(st.infoShow?1:.92)+')'});
  Object.assign($('ex2').style,{opacity:st.infoShow?1:0,transform:st.infoShow?'none':'translateY(8px) scale(.8)'});
  const on=st.audio,sk=$('spk');Object.assign(sk.style,{background:on?BLUE:'#fff',color:on?'#fff':'#3a4860',borderColor:on?BLUE:'#e1e8ef',boxShadow:on?'0 8px 18px rgba(10,132,255,.28)':'0 4px 12px rgba(23,35,58,.06)'});
  $('wv').setAttribute('d',on?'M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11':'m16 9.5 5 5m0-5-5 5');
  const ln=(LANGS.find(l=>l[0]===st.lang)||LANGS[0])[1];sk.setAttribute('aria-label',on?'Narration on · '+ln:'Narration off');
  const mn=$('menu');Object.assign(mn.style,{position:'absolute',right:'58px',top:0,width:'200px',padding:'6px',boxSizing:'border-box',borderRadius:'20px',background:'rgba(255,255,255,.96)',backdropFilter:'blur(20px)',border:'1px solid #e6ecf2',boxShadow:'0 18px 44px rgba(23,35,58,.16)',display:'flex',flexDirection:'column',gap:'2px',opacity:st.menu?1:0,transform:'translateX('+(st.menu?0:8)+'px) scale('+(st.menu?1:.96)+')',transformOrigin:'right top',pointerEvents:st.menu?'auto':'none',transition:'opacity 180ms ease-out,transform 220ms cubic-bezier(.2,.8,.2,1)'});
  if(!mn.children.length)mn.innerHTML='<div style="padding:6px 12px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8391a6">Narration</div>'+LANGS.map(l=>'<button data-l="'+l[0]+'" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:14px;text-align:left"><span style="display:flex;flex-direction:column;align-items:flex-start"><span style="font-size:15px;font-weight:700">'+l[2]+'</span><span style="font-size:12px;font-weight:500;color:#8391a6">'+l[1]+'</span></span><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#0a84ff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>').join('');
  [...mn.querySelectorAll('button')].forEach(b=>{const s=b.dataset.l===st.lang;b.style.background=s?'#eaf3ff':'transparent';b.style.color=s?BLUE:INK;b.lastChild.style.opacity=s?1:0});
  if(st.audio&&st.capIn&&capNow!==spoken)speak();
}
function fit(){const k=Math.min(innerWidth/1024,innerHeight/768);$('cv').style.transform='scale('+k+')'}
function openInfo(){st.info=true;st.menu=false;render();setTimeout(()=>{st.infoShow=true;render()},20)}
function closeInfo(){st.infoShow=false;render();setTimeout(()=>{st.info=false;render();const p=pending;pending=null;if(p)p()},260)}
$('inf').onclick=openInfo;$('ix').onclick=closeInfo;$('ist').onclick=closeInfo;$('info').onclick=closeInfo;$('card').onclick=e=>e.stopPropagation();
$('tap').onclick=stageTap;$('nx').onclick=next;$('bk').onclick=back;$('rp').onclick=()=>go(st.step);
$('x').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}go(0)};
$('wa').onclick=()=>go(0);$('ta').onclick=()=>go(LAST,{list:[randomP()]});
$('spw').onmouseenter=()=>{st.menu=true;render()};$('spw').onmouseleave=()=>{st.menu=false;render()};
$('spk').onclick=()=>{st.audio=!st.audio;st.menu=true;savePref();if(st.audio){spoken=null;render()}else{try{speechSynthesis.cancel()}catch(e){}render()}};
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.lang=b.dataset.l;st.audio=true;spoken=null;savePref();render()};
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(st.info){if(e.key==='Escape')closeInfo();return}
  if(/^[0-9]$/.test(e.key))return press(e.key);
  if(e.key==='Backspace')return del();
  if(e.key==='ArrowRight')return next();if(e.key==='ArrowLeft')return back();
  if(e.key===' '&&st.step<LAST){e.preventDefault();return stageTap()}
  if(e.key==='r'||e.key==='R')return go(st.step);
});
try{const v=JSON.parse(localStorage.getItem('vedica-narration')||'null');if(v){st.lang=v.lang||'en';st.audio=!!v.audio}}catch(e){}
fit();
// Resume: every step is saved, and an unfinished lesson reopens at the step it was left on.
(function(){var K='vedica-resume',id=window.__vdLesson||location.pathname.split('/').pop(),g=go,sv;
go=function(s,o){try{var r=JSON.parse(localStorage.getItem(K)||'{}');r[id]=s;localStorage.setItem(K,JSON.stringify(r))}catch(e){}return g(s,o)};
try{sv=JSON.parse(localStorage.getItem(K)||'{}')[id]}catch(e){}
if(sv>0&&sv<=LAST)go(sv);else{pending=()=>go(0);openInfo()}})();
</script>
