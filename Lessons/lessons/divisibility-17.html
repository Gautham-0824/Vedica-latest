<div id="wrap"><div id="cv"></div></div>
<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1800ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: divisibility by osculation (Ekadhika: positive osculator) ---------- */
function yav(n,m){
  n=String(n);m=String(m);const d=+m;let k=1;while((d*k)%10!==9)k++;
  const mul=d*k,front=String((mul-9)/10),osc=+front+1,rounds=[],seq=[+n];let cur=+n;
  while(cur>=100&&rounds.length<6){const rest=Math.floor(cur/10),last=cur%10,p=last*osc,nx=rest+p;if(nx>=cur)break;rounds.push({cur,rest,last,p,nx});seq.push(nx);cur=nx}
  const fin=cur,yes=fin%d===0,j=fin/d,q=+n/d;
  return {n,m,d,k,mul,front,osc,rounds,seq,fin,yes,j,q,ans:'',ok:yes===(+n%d===0)};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.6*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.24));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,52);
  S.box('bub',512,BY,Math.max(300,q.total+90),104,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const NY=190,NZ=88,OX=850,HY=370,colOf=()=>BLUE;
function topN(S,v,split,y=NY,z=NZ,id='nw'){
  if(!split){S.el(id,v,512,y,{z});return {}}
  const rest=String(Math.floor(v/10)),last=v%10,rw=rest.length*z*.6,dw=z*.6,gap=z*.9,tot=rw+gap+dw,x0=512-tot/2;
  S.el('rs',rest,x0+rw/2,y,{z});S.el('ld',last,x0+tot-dw/2,y,{z});
  S.box('dv',x0+rw+gap/2,y,4,z*.9,{fill:'#c9d3df',c:'#c9d3df',r:2});
  return {rx:x0+rw/2,lx:x0+tot-dw/2};
}
function badge(S,Y,on,val=Y.osc,y=NY){
  S.box('ob',OX,y,96,84,{shadow:true,r:20,o:on?1:0,c:'#ffb979',fill:'#fff4e8'});
  S.el('os',val,OX,y,{z:52,c:OR,o:on?1:0});
  S.el('oL','osculator',OX,y-64,{z:17,c:OR,w:800,o:on?1:0});
  S.el('oD','for '+Y.d,OX,y+62,{z:15,c:MU,w:700,o:on?1:0});
}
function chain(S,Y,upto,y=HY){
  if(!upto)return;const its=[];for(let i=0;i<=upto;i++){if(i)its.push({id:'ha'+i,t:'→',op:1,c:MU});its.push({id:'h'+i,t:Y.seq[i],c:i===upto?INK:MU})}
  seq(S,its,512,y,30);
}
function round(S,Y,ph,k){
  const R=Y.rounds[k];badge(S,Y,true);
  const P=ph<4?topN(S,R.cur,true):topN(S,R.nx,false);
  chain(S,Y,ph>=4?k+1:k);
  let b=null;
  if(ph===1||ph===2)b=bub(S,[{id:'p0',t:R.last},{id:'p1',t:'×',op:1,c:MU},{id:'p2',t:Y.osc,c:OR},{id:'p3',t:'=',op:1,c:MU},{id:'pp',t:R.p,res:1}],1,1,ph>=2?1:0);
  if(ph===3){b=bub(S,[{id:'q0',t:R.rest},{id:'q1',t:'+',op:1,c:MU},{id:'pp',t:R.p},{id:'q3',t:'=',op:1,c:MU},{id:'nw',t:R.nx,res:1,c:BLUE}],1,1,1);S.mod('nw',{z:NZ,s:52/NZ})}
  const SA={bend:0,w:3,h:9};
  if(ph===0){S.mod('ld',{c:BLUE});S.f('ld','os','ob');S.h('ld')}
  if(ph===1){S.mod('ld',{c:BLUE});S.f('ld','os','ob','bub',b.rest);S.h('os')}
  if(ph===2){S.f('bub',b.res);S.h('pp')}
  if(ph===3){S.mod('rs',{c:BLUE});S.f('rs','bub',b.ids);S.h('rs')}
  if(ph>=4){S.f('nw','h'+(k+1));S.h('nw')}
}
const ST={
  idea(S,Y,ph){badge(S,Y,true,Y.osc,300);for(const id of['ob','os','oL','oD'])S.mod(id,{x:512});S.mod('ob',{s:1.3});S.mod('os',{s:1.3});S.mod('oL',{y:300-96,z:22});S.mod('oD',{y:300+92,z:20});if(ph===0)S.hide(['os'])},
  meet(S,Y,ph){topN(S,Y.n,false);if(ph===0)S.hide(['nw'])},
  osc(S,Y,ph){
    badge(S,Y,ph>=3);
    seq(S,[{id:'a0',t:Y.d},{id:'a1',t:'×',op:1,c:MU},{id:'a2',t:Y.k},{id:'a3',t:'=',op:1,c:MU},{id:'a4',t:Y.front,g:3},{id:'a5',t:'9'}],512,260,64);
    if(ph>=1){S.mod('a5',{c:MU});S.el('a6','drop the 9',S.E[Object.keys(S.E).find(k=>k.endsWith('.a5'))].x,316,{z:18,c:MU,w:800})}
    if(ph>=2){const x1=S.E[Object.keys(S.E).find(k=>k.endsWith('.a4'))].x;const q=seq(S,[{id:'a4',t:Y.front},{id:'b1',t:'+',op:1,c:MU},{id:'b2',t:'1'},{id:'b3',t:'=',op:1,c:MU},{id:'os',t:Y.osc,c:OR}],512,420,64);S.mod('a4',{c:BLUE})}
    if(ph>=3){S.mod('os',{x:OX,y:NY,z:52});S.f('ob','os','oL','oD');S.h('os')}
    else if(ph===2){S.f('a4','b1','b2','b3','os');S.h('os')}
    else if(ph===1){S.f('a4','a5','a6')}
  },
  fast(S,Y,ph){
    badge(S,Y,true);const k=Math.min(ph,Y.rounds.length);
    topN(S,Y.seq[k],false,NY,NZ,'n'+k);chain(S,Y,k);
    if(ph>=1&&ph<=Y.rounds.length){const R=Y.rounds[ph-1];
      const its=[{t:R.rest},{t:'+',op:1,c:MU},{t:R.last},{t:'×',op:1,c:MU},{t:Y.osc,c:OR},{t:'=',op:1,c:MU},{t:R.nx,c:BLUE}].map((x,i)=>({...x,id:'w'+ph+'_'+i}));
      bub(S,its,1,1,1);S.f('n'+k,'h'+k,'bub',its.map(x=>x.id))}
  },
  result(S,Y,ph){
    if(ph>=3){const ids=eq(S,Y,300,GR);S.f(ids);S.finale={x:512,y:300,w:700,h:170};S.win=true;return}
    badge(S,Y,true);topN(S,Y.fin,false,NY,NZ,'nf');chain(S,Y,Y.rounds.length);
    const J=Math.max(Math.floor(99/Y.d),Y.j),xs=xsOf(J,512,90);
    for(let j=1;j<=J;j++){const hit=ph>=2&&j===Y.j;
      S.box('lb'+j,xs[j-1],520,74,64,{shadow:true,r:18,o:ph>=1?1:0,c:hit?'#a8e2c6':'#e1e8ef'});
      S.el('lc'+j,Y.d*j,xs[j-1],520,{z:30,c:hit?GR:INK,o:ph>=1?1:0});
      S.el('ll'+j,j+' × '+Y.d,xs[j-1],574,{z:15,c:hit?GR:MU,w:800,o:ph>=1?1:0})}
    if(ph===0){S.f('nf')}
    if(ph===1){S.f('nf',Array.from({length:J},(_,i)=>['lb'+(i+1),'lc'+(i+1),'ll'+(i+1)]).flat())}
    if(ph===2){S.mod('nf',{c:GR});S.f('nf','lb'+Y.j,'lc'+Y.j,'ll'+Y.j);S.h('lc'+Y.j)}
  },
};
[0,1,2].forEach(k=>ST['r'+(k+1)]=(S,Y,ph)=>round(S,Y,ph,k));
function mulStep(S,Y,ph,k){
  const R=Y.rounds[k];badge(S,Y,true);topN(S,R.cur,true);chain(S,Y,k);S.mod('ld',{c:BLUE});
  const b=bub(S,[{id:'p0',t:R.last},{id:'p1',t:'×',op:1,c:MU},{id:'p2',t:Y.osc,c:OR},{id:'p3',t:'=',op:1,c:MU},{id:'pp',t:R.p,res:1}],ph>=2?1:0,ph>=2?1:0,ph>=3?1:0);
  if(ph===0){S.f('ld');S.h('ld')}
  if(ph===1){S.f('ld','os');S.h('os')}
  if(ph===2){S.f('ld','os','bub',b.rest);S.h('p2')}
  if(ph>=3){S.f('bub',b.ids);S.h('pp')}
}
function addStep(S,Y,ph,k){
  const R=Y.rounds[k];badge(S,Y,true);
  if(ph<3){topN(S,R.cur,true);chain(S,Y,k);S.mod('rs',{c:BLUE});
    const b=bub(S,[{id:'q0',t:R.rest},{id:'q1',t:'+',op:1,c:MU},{id:'pp',t:R.p},{id:'q3',t:'=',op:1,c:MU},{id:'nw',t:R.nx,res:1,c:BLUE}],1,1,ph>=2?1:0);
    S.mod('nw',{z:NZ,s:52/NZ});
    if(ph===0){S.f('rs','bub','q0');S.h('rs')}
    if(ph===1){S.f('rs','bub',b.rest);S.h('pp')}
    if(ph===2){S.f('bub',b.ids);S.h('nw')}}
  else{topN(S,R.nx,false);chain(S,Y,k+1);S.f('nw','h'+(k+1));S.h('nw')}
}
[0,1,2].forEach(k=>{ST['m'+(k+1)]=(S,Y,ph)=>mulStep(S,Y,ph,k);ST['a'+(k+1)]=(S,Y,ph)=>addStep(S,Y,ph,k)});
function eq(S,Y,y,col){
  const items=[{id:'rn',t:Y.n},{id:'rq',t:'=',op:1,c:MU},{id:'rd',t:Y.d},{id:'rx',t:'×',op:1,c:MU},{id:'rk',t:Y.q}];
  items.forEach(i=>{if(!i.op)i.c=col});seq(S,items,512,y,56);return items.map(i=>i.id);
}
const SUM={idea:Y=>'Osculator: '+Y.osc,osc:Y=>'Osculator: '+Y.osc,fast:Y=>'Rounds: '+Y.seq.slice(1).join(', ')};
[0,1,2].forEach(k=>{SUM['r'+(k+1)]=Y=>'Round '+(k+1)+': '+Y.rounds[k].nx;SUM['a'+(k+1)]=SUM['r'+(k+1)]});
const HL={osc:OR,fast:BLUE,r1:BLUE,r2:BLUE,r3:BLUE};
const CAP={
  idea:Y=>'For **'+Y.d+'**, the **osculator** is **'+Y.osc+'**. We use it in the whole lesson.',
  meet:Y=>'Is **'+Y.n+'** divisible by **'+Y.d+'**? Find out without dividing.',
  osc:Y=>'**'+Y.d+' × '+Y.k+' = '+Y.mul+'** ends in 9. Drop the 9, add 1 → **'+Y.osc+'**. That’s the **osculator**.',
  fast:Y=>'Same moves: **'+Y.seq.join(' → ')+'**.',
  result:Y=>'**'+Y.fin+' = '+Y.j+' × '+Y.d+'**, so **'+Y.n+'** is divisible by **'+Y.d+'**.',
};
[0,1,2].forEach(k=>{CAP['m'+(k+1)]=Y=>{const R=Y.rounds[k];return 'Multiply the last digit by the osculator: **'+R.last+' × '+Y.osc+' = '+R.p+'**.'};CAP['a'+(k+1)]=Y=>{const R=Y.rounds[k];return 'Add it to the rest: **'+R.rest+' + '+R.p+' = '+R.nx+'**.'}});
[0,1,2].forEach(k=>CAP['r'+(k+1)]=Y=>{const R=Y.rounds[k];return 'Last digit × '+Y.osc+': **'+R.last+' × '+Y.osc+' = '+R.p+'**. Add to the rest: **'+R.rest+' + '+R.p+' = '+R.nx+'**.'});
const S5=[[0,1300,2600,4000,5500],7000],MT=[[0,1200,2400,3600],5000],AT=[[0,1200,2400,3800],5400];
const TM={idea:[[0,900],3000],meet:[[0,900],2600],m1:MT,m2:MT,m3:MT,a1:AT,a2:AT,a3:AT,r1:S5,r2:S5,r3:S5,result:[[0,1100,2600,4200],6000],practice:[[0,500],700]};
const E1='2431',E1m='17',E2='2958',E2m='17';
const LIST=[['idea',E1,E1m,'The osculator'],['meet',E1,E1m,'Meet the problem'],['m1',E1,E1m,'Round 1: multiply'],['a1',E1,E1m,'Round 1: add'],['m2',E1,E1m,'Round 2: multiply'],['a2',E1,E1m,'Round 2: add'],['result',E1,E1m,'The result'],
['r1',E2,E2m,'Try 2958: round 1'],['r2',E2,E2m,'Round 2'],['result',E2,E2m,'The result'],['practice','','','Your turn']];
new Set(Object.values(TM)).forEach(v=>{v[0]=v[0].map(t=>Math.round(t*1.5));v[1]=Math.round(v[1]*1.5)});
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Ekadhika: one more than the one before';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'1734',m:'17'},{n:'3706',m:'17'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomP(){for(;;){const d=17,n=d*rnd(Math.ceil(1000/d),Math.floor(9999/d)),Y=yav(n,d);if(Y.rounds.length>=1&&Y.rounds.length<=3&&Y.fin>0&&Y.fin<100)return {n:String(n),m:String(d)}}}
function tasks(Y){
  const T=[{cap:'What is the **osculator** of **'+Y.d+'**?',ok:Y.d+' × '+Y.k+' = '+Y.mul+', so '+Y.osc,ans:String(Y.osc),g:'idea',hint:'Close! Find '+Y.d+' × ? ending in 9. Drop the 9, add 1.'}];
  Y.rounds.forEach((R,k)=>{T.push({ty:'m',k,cap:'Multiply: **'+R.last+' × '+Y.osc+'** = ?',ok:R.last+' × '+Y.osc+' = '+R.p,ans:String(R.p),g:'m1',hint:'Close! Last digit × '+Y.osc+'.'});T.push({ty:'a',k,cap:'Add: **'+R.rest+' + '+R.p+'** = ?',ok:R.rest+' + '+R.p+' = '+R.nx,ans:String(R.nx),g:'a1',hint:'Close! Add it to the rest.'})});
  T.push({cap:'**'+Y.fin+'** is how many '+Y.d+'s?',ok:Y.fin+' = '+Y.j+' × '+Y.d+'. Divisible!',ans:String(Y.j),g:'result',hint:'Close! Count up in '+Y.d+'s.'});
  return T;
}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,fin=pr.done||(pr.ok&&t===T.length-1),c=T[t];
  if(fin){eq(S,Y,260,GR);S.finale={x:512,y:260,w:700,h:160};return}
  badge(S,Y,true,t>0||pr.ok?Y.osc:'?',170);
  if(c.ty==='m'){topN(S,Y.seq[c.k],true,170,72);S.mod('ld',{c:BLUE});chain(S,Y,c.k,320);if(!pr.ok)S.h(pulse?'os':'ld')}
  else if(c.ty==='a'&&!pr.ok){topN(S,Y.seq[c.k],true,170,72);S.mod('rs',{c:BLUE});chain(S,Y,c.k,320);S.h('rs')}
  else{const i=c.ty==='a'?c.k+1:t===0?0:Y.rounds.length;topN(S,Y.seq[i],false,170,72,'n'+i);chain(S,Y,i,320)}
}
let pulse=0;setInterval(()=>{if(st.step===LAST&&st.phase>=1&&st.pr&&!st.pr.done&&!st.pr.replay&&!st.pr.ok){pulse^=1;render()}},3400);
let bad=[];
for(let i=0;i<4000;i++){const d=17,n=rnd(100,99999),Y=yav(n,d);if(!Y.ok)bad.push(n+'/'+d)}
PRACTICE.concat([{n:E1,m:E1m},{n:E2,m:E2m}]).forEach(p=>{if(!yav(p.n,p.m).yes)bad.push(p.n)});
console.log(bad.length?'[Vedica] osculator tests FAILED '+bad.slice(0,5).join(','):'[Vedica] osculator test agrees with division on 4,000 numbers');

/* ---------- chrome ---------- */
const cv=document.getElementById('cv');
cv.innerHTML=`
