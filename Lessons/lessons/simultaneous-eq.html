<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c}}

html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#17233a}

.key:active{transform:scale(.9);background:#eaf3ff}
.pri{height:56px;padding:0 30px;border-radius:99px;border:0;background:#0a84ff;color:#fff;font-size:17px;font-weight:700;box-shadow:0 10px 24px rgba(10,132,255,.3);transition:transform 140ms}
.sec{height:56px;padding:0 26px;border-radius:99px;border:1px solid #e1e8ef;background:#fff;color:#3a4860;font-size:17px;font-weight:600;box-shadow:0 4px 12px rgba(23,35,58,.05);transition:transform 140ms}
.pri:active,.sec:active{transform:scale(.96)}
@keyframes vdRing{0%{transform:scale(.35);opacity:0}25%{opacity:.9}100%{transform:scale(1.8);opacity:0}}

<body>
<div id="wrap"><div id="cv"></div></div>
<script>
const INK='#17233a',BLUE='#0a84ff',OR='#e86f00',GR='#1a9e62',MU='#8391a6';
const XE='cubic-bezier(.55,0,.25,1)',YE='cubic-bezier(.25,.9,.3,1.06)',HE='cubic-bezier(.45,0,.2,1)',DUR='1800ms',Z=96,ADV=60,RY=320,BY=530;
const digs=n=>String(n).split('').map(Number);
const xsOf=(n,cx,a)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*a);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the maths: simultaneous equations by Paravartya (cross-multiplication) and Anurupye Shunyamanyat ---------- */
const fmt=v=>v<0?'−'+(-v):String(v);
function yav(n,m){
  n=String(n);m=String(m||'');const [r1,r2]=n.split(';').map(r=>r.split(',').map(Number)),[a,b,c]=r1,[d,e,f]=r2;
  const den=b*d-a*e,xt=b*f-c*e,yt=c*d-a*f,x=xt/den,y=yt/den;
  const k=e/b,ratio=Number.isInteger(k)&&f===c*k&&d!==a*k;
  const ok=den!==0&&a*x+b*y===c&&d*x+e*y===f;
  const eqs=[[a,b,c],[d,e,f]].map(([p,q,r])=>(p===1?'':p)+'x + '+(q===1?'':q)+'y = '+r);
  return {n,m,a,b,c,d,e,f,den,xt,yt,x,y,k,ratio,eqs,ans:'',ok};
}

/* ---------- scene toolkit (same model as the Basic lessons) ---------- */
function mk(pre){
  const S={E:{},B:{},A:[],focus:null,hand:null,finale:null,win:false};
  S.el=(id,t,x,y,o)=>S.E[pre+id]={t:String(t),x,y,o:1,s:1,c:INK,z:Z,w:900,dl:0,...o};
  S.mod=(id,p)=>{const e=S.E[pre+id]||S.B[pre+id];if(e)Object.assign(e,p)};
  S.box=(id,x,y,w,h,o)=>S.B[pre+id]={x,y,w,h,o:1,s:1,r:22,dashed:false,c:'#e1e8ef',fill:'#ffffff',shadow:false,q:'',dl:0,...o};
  S.f=(...a)=>{S.focus=(S.focus||[]).concat(a.flat().map(i=>pre+i))};
  S.h=id=>{S.hand={k:pre+id}};
  S.arrow=(i,p0,p1,o)=>{S.A[i]={p0,p1,c:BLUE,st:1,bend:.28,dl:0,...o}};
  S.hide=ids=>ids.forEach(id=>{const e=S.E[pre+id];if(e){e.o=0;e.y+=26}});
  return S;
}
function seq(S,items,cx,y,z){
  const w=it=>/^[0-9]$/.test(it.t)?z*.62:z*.56*String(it.t).length;
  const gaps=items.map((it,i)=>i===items.length-1?0:(it.g??z*.36));
  const total=items.reduce((a,it,i)=>a+w(it)+gaps[i],0);let x=cx-total/2;const xs=[];
  items.forEach((it,i)=>{const c=x+w(it)/2;xs.push(c);S.el(it.id,it.t,c,y,{z,w:it.op?700:900,c:it.c||INK,o:it.o??1});x+=w(it)+gaps[i]});
  return {xs,total};
}
function bub(S,items,bo,to,ro){
  const its=items.map(i=>({...i,o:i.o!==undefined?i.o:(i.res?ro:to)})),q=seq(S,its,512,BY,46);
  S.box('bub',512,BY,Math.max(300,q.total+90),96,{shadow:true,r:28,o:bo});
  return {xs:q.xs,ids:its.map(i=>i.id),res:its.filter(i=>i.res).map(i=>i.id),rest:its.filter(i=>!i.res).map(i=>i.id)};
}
/* ---------- scenes ---------- */
const OX=870,OY=255,colOf=()=>BLUE,CXS={a:300,b:445,c:600},LX={x:350,y:495},PX=385,QX=545;
function eqs(S,Y,o={}){
  const {on=1,dy=0,hl={}}=o,R=[205+dy,300+dy];
  [['a','b','c'],['d','e','f']].forEach((row,r)=>{
    row.forEach((k,j)=>S.el('e_'+k,Y[k],CXS['abc'[j]],R[r],{z:58,c:hl[k]||INK,o:on}));
    S.el('e_x'+r,'x',LX.x,R[r]+6,{z:34,c:MU,w:700,o:on});S.el('e_p'+r,'+',PX,R[r],{z:38,c:MU,w:700,o:on});
    S.el('e_y'+r,'y',LX.y,R[r]+6,{z:34,c:MU,w:700,o:on});S.el('e_q'+r,'=',QX,R[r],{z:38,c:MU,w:700,o:on});
  });
  return R;
}
const POS=(k,R)=>[CXS[{a:'a',b:'b',c:'c',d:'a',e:'b',f:'c'}[k]],R['abcdef'.indexOf(k)<3?0:1]];
function cross(S,i,p,q,R,col){const [x0,y0]=POS(p,R),[x1,y1]=POS(q,R),dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),u=[dx/L,dy/L];
  S.arrow(i,[x0+u[0]*34,y0+u[1]*34],[x1-u[0]*34,y1-u[1]*34],{bend:0,w:2.5,h:8,c:col})}
function badge(S,Y,on,val=Y.den,x=OX,y=OY){
  S.box('ob',x,y,96,84,{shadow:true,r:20,o:on?1:0,c:'#ffb979',fill:'#fff4e8'});
  S.el('os',val,x,y,{z:46,c:OR,o:on?1:0});
  S.el('oL','bottom',x,y-64,{z:17,c:OR,w:800,o:on?1:0});
  S.el('oD','for x and y',x,y+62,{z:15,c:MU,w:700,o:on?1:0});
}
function card(S,Y,v,st,dy=0){ // st: 0 hidden, 1 top only, 2 fraction, 3 solved
  const cx=v==='x'?420:640,y=430+dy,top=v==='x'?Y.xt:Y.yt,val=Y[v];
  S.el(v+'l',v+' =',cx-62,y,{z:40,c:MU,w:800,o:st?1:0});
  S.el(v+'t',fmt(top),cx+18,y-30,{z:34,c:BLUE,o:st>=1&&st<3?1:0});
  S.box(v+'ln',cx+18,y,56,3,{fill:'#c9d3df',c:'#c9d3df',r:2,o:st>=2&&st<3?1:0});
  S.el(v+'b',fmt(Y.den),cx+18,y+30,{z:34,c:OR,o:st>=2&&st<3?1:0});
  S.el(v+'v',fmt(val),cx+18,y,{z:56,c:GR,o:st>=3?1:0});
}
function base(S,Y,cs){const R=eqs(S,Y,{hl:cs.hl||{}});badge(S,Y,cs.bd);card(S,Y,'x',cs.x||0);card(S,Y,'y',cs.y||0);return R}
// cross step: pairs [[p,q],[r,s]], target 'den'|'x'|'y'
function crossStep(S,Y,ph,pairs,res,cs,dest){
  const hl={};if(ph>=0){hl[pairs[0][0]]=BLUE;hl[pairs[0][1]]=BLUE}if(ph>=2){hl[pairs[1][0]]=OR;hl[pairs[1][1]]=OR}
  const fin=ph>=4,R=base(S,Y,{...cs,hl,...(fin?dest:{})});
  if(ph<4){cross(S,0,pairs[0][0],pairs[0][1],R,BLUE);if(ph>=2)cross(S,1,pairs[1][0],pairs[1][1],R,OR)}
  const its=[{id:'k0',t:Y[pairs[0][0]]+'×'+Y[pairs[0][1]],c:BLUE},{id:'k1',t:'−',op:1,c:MU,o:ph>=2?1:0},{id:'k2',t:Y[pairs[1][0]]+'×'+Y[pairs[1][1]],c:OR,o:ph>=2?1:0},{id:'k3',t:'=',op:1,c:MU,o:ph>=3?1:0},{id:res.id,t:fmt(res.v),c:INK,o:ph>=3?1:0}];
  if(ph>=1&&ph<4){const b=bub(S,its,1,1,1);S.f('bub',its.filter(i=>i.o!==0).map(i=>i.id))}
  if(ph===0)S.h('e_'+pairs[0][0]);
  if(ph===1)S.h('k0');
  if(ph===2)S.h('e_'+pairs[1][0]);
  if(ph===3)S.h(res.id);
  if(fin)S.h(res.id);
}
function divStep(S,Y,ph,v){
  const fin=ph>=3,R=base(S,Y,{bd:1,x:v==='x'?(fin?3:2):(Y.x!==undefined?3:0),y:v==='y'?(fin?3:2):0});
  if(v==='y')card(S,Y,'x',3);
  const top=v==='x'?Y.xt:Y.yt;
  if(ph>=1&&ph<3){const its=[{id:v+'t',t:fmt(top),c:BLUE},{id:'d1',t:'÷',op:1,c:MU},{id:v+'b',t:fmt(Y.den),c:OR},{id:'d3',t:'=',op:1,c:MU},{id:v+'v',t:fmt(Y[v]),c:GR,res:1}];bub(S,its,1,1,ph>=2?1:0)}
  if(ph===0)S.h(v+'t');if(ph===1)S.h(v+'b');if(ph>=2)S.h(v+'v');
}
const ST={
  meet(S,Y,ph){eqs(S,Y,{on:ph>=1?1:0});badge(S,Y,false);card(S,Y,'x',0);card(S,Y,'y',0)},
  den(S,Y,ph){crossStep(S,Y,ph,[['b','d'],['a','e']],{id:'os',v:Y.den},{bd:0},{bd:1})},
  xtop(S,Y,ph){crossStep(S,Y,ph,[['b','f'],['c','e']],{id:'xt',v:Y.xt},{bd:1},{x:2})},
  xval(S,Y,ph){divStep(S,Y,ph,'x')},
  ytop(S,Y,ph){crossStep(S,Y,ph,[['c','d'],['a','f']],{id:'yt',v:Y.yt},{bd:1,x:3},{x:3,y:2})},
  yval(S,Y,ph){divStep(S,Y,ph,'y')},
  result(S,Y,ph){
    if(ph>=1){S.el('r1',Y.eqs[0]+'   and   '+Y.eqs[1],512,250,{z:24,c:MU,w:800});S.el('r2','x = '+fmt(Y.x)+',  y = '+fmt(Y.y),512,320,{z:52,c:GR});S.finale={x:512,y:285,w:640,h:180};S.win=true;return}
    base(S,Y,{bd:1,x:3,y:3});
  },
  rmeet(S,Y,ph){const hl=ph>=1?{b:BLUE,e:BLUE}:{};if(ph>=2){hl.c=OR;hl.f=OR}const R=eqs(S,Y,{hl});
    S.el('k_y','×'+Y.k,CXS.b+60,252,{z:26,c:BLUE,w:800,o:ph>=1?1:0});S.el('k_c','×'+Y.k,CXS.c+60,252,{z:26,c:OR,w:800,o:ph>=2?1:0});
    card(S,Y,'x',ph>=3?3:0);card(S,Y,'y',0);if(ph===1)S.h('e_e');if(ph===2)S.h('e_f');if(ph>=3)S.h('xv')},
  ryval(S,Y,ph){eqs(S,Y,{hl:{b:BLUE,c:BLUE}});card(S,Y,'x',3);card(S,Y,'y',ph>=2?3:0);
    if(ph===1){bub(S,[{id:'u0',t:Y.c,c:BLUE},{id:'u1',t:'÷',op:1,c:MU},{id:'u2',t:Y.b,c:BLUE},{id:'u3',t:'=',op:1,c:MU},{id:'yv',t:fmt(Y.y),c:GR}],1,1,1);S.h('yv')}
    if(ph===0)S.h('e_c');if(ph>=2)S.h('yv')},
};
const SUM={den:Y=>'Bottom: '+Y.den,xval:Y=>'x = '+Y.x,yval:Y=>'y = '+Y.y,rmeet:Y=>'x = 0',ryval:Y=>'y = '+Y.y};
const HL={den:OR,xval:GR,yval:GR,rmeet:GR,ryval:GR};
const CAP={
  meet:Y=>'Solve together: **'+Y.eqs[0]+'** and **'+Y.eqs[1]+'**.',
  den:Y=>'Bottom number: cross **y with x**. **'+Y.b+'×'+Y.d+' − '+Y.a+'×'+Y.e+' = '+Y.den+'**.',
  xtop:Y=>'Top for x: cross **y with the right side**. **'+Y.b+'×'+Y.f+' − '+Y.c+'×'+Y.e+' = '+Y.xt+'**.',
  xval:Y=>'x = top ÷ bottom: **'+Y.xt+' ÷ '+Y.den+' = '+Y.x+'**.',
  ytop:Y=>'Top for y: cross **the right side with x**. **'+Y.c+'×'+Y.d+' − '+Y.a+'×'+Y.f+' = '+Y.yt+'**.',
  yval:Y=>'y = top ÷ bottom: **'+Y.yt+' ÷ '+Y.den+' = '+Y.y+'**.',
  result:Y=>'So **x = '+Y.x+'** and **y = '+Y.y+'**.',
  rmeet:Y=>'Shortcut: **'+Y.b+' → '+Y.e+'** is ×'+Y.k+', and **'+Y.c+' → '+Y.f+'** is ×'+Y.k+' too. Same ratio, so **x = 0**.',
  ryval:Y=>'With x = 0: **'+Y.b+'y = '+Y.c+'**, so **y = '+Y.y+'**.',
};
const T4=[[0,1300,2600,3900,5200],6600],T3=[[0,1300,2600,3900],5200];
const TM={meet:[[0,900],2600],den:T4,xtop:T4,ytop:T4,xval:T3,yval:T3,result:[[0,1400],3400],rmeet:[[0,1300,2800,4300],5800],ryval:[[0,1400,2800],4200],practice:[[0,500],700]};
new Set(Object.values(TM)).forEach(v=>{if(v===TM.practice)return;v[0]=v[0].map(t=>Math.round(t*1.5));v[1]=Math.round(v[1]*1.5)});
const E1='1,2,7;3,1,11',E2='3,2,4;5,6,12';
const LIST=[['meet',E1,'','Meet the problem'],['den',E1,'','Bottom number'],['xtop',E1,'','Top for x'],['xval',E1,'','Find x'],['ytop',E1,'','Top for y'],['yval',E1,'','Find y'],['result',E1,'','The answer'],
['rmeet',E2,'','Shortcut: x = 0'],['ryval',E2,'','Find y'],['practice','','','Your turn']];
const STEPS=LIST.map(([g,n,m,name])=>({g,n,m,name,times:TM[g][0],end:TM[g][1]}));
const LAST=STEPS.length-1;
const SUTRA='Paravartya and Anurupye Shunyamanyat';
const LANGS=[['en','English','English','en-IN'],['hi','Hindi','हिन्दी','hi-IN'],['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['ml','Malayalam','മലയാളം','ml-IN']];
const PRACTICE=[{n:'2,1,8;4,1,12',m:''},{n:'4,3,22;2,1,10',m:''}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function randomP(){for(;;){const a=rnd(1,6),b=rnd(1,6),d=rnd(1,6),e=rnd(1,6),x=rnd(1,6),y=rnd(1,6);if(b*d-a*e<=0||b*d-a*e>6)continue;const c=a*x+b*y,f=d*x+e*y;return {n:[a,b,c].join(',')+';'+[d,e,f].join(','),m:''}}}
function tasks(Y){return [
  {ty:'den',cap:'Bottom: **'+Y.b+'×'+Y.d+' − '+Y.a+'×'+Y.e+'** = ?',ok:'bottom = '+Y.den,ans:String(Y.den),g:'den',hint:'Close! Cross y with x, then subtract.'},
  {ty:'x',cap:'x = **('+Y.b+'×'+Y.f+' − '+Y.c+'×'+Y.e+') ÷ '+Y.den+'** = ?',ok:'x = '+Y.xt+' ÷ '+Y.den+' = '+Y.x,ans:String(Y.x),g:'xtop',hint:'Close! Cross y with the right side, then ÷ bottom.'},
  {ty:'y',cap:'y = **('+Y.c+'×'+Y.d+' − '+Y.a+'×'+Y.f+') ÷ '+Y.den+'** = ?',ok:'y = '+Y.yt+' ÷ '+Y.den+' = '+Y.y,ans:String(Y.y),g:'ytop',hint:'Close! Cross the right side with x, then ÷ bottom.'}]}
function eq(S,Y,y,col){S.el('r1',Y.eqs[0]+'   and   '+Y.eqs[1],512,y-34,{z:22,c:MU,w:800});S.el('r2','x = '+fmt(Y.x)+',  y = '+fmt(Y.y),512,y+24,{z:46,c:col});return ['r1','r2']}
function pscene(S,Y,pr){
  const T=tasks(Y),t=pr.task,fin=pr.done||(pr.ok&&t===T.length-1);
  if(fin){eq(S,Y,260,GR);S.finale={x:512,y:255,w:640,h:160};return}
  const P=[['b','d','a','e'],['b','f','c','e'],['c','d','a','f']][t],hl={};hl[P[0]]=BLUE;hl[P[1]]=BLUE;hl[P[2]]=OR;hl[P[3]]=OR;
  const R=eqs(S,Y,{dy:-70,hl});cross(S,0,P[0],P[1],R,BLUE);cross(S,1,P[2],P[3],R,OR);
  badge(S,Y,true,t>0||pr.ok?Y.den:'?',OX,180);
  card(S,Y,'x',t>1||(t===1&&pr.ok)?3:0,-100);card(S,Y,'y',t===2&&pr.ok?3:0,-100);
  if(!pr.ok)S.h('e_'+(pulse?P[2]:P[0]));
}
let pulse=0;setInterval(()=>{if(st.step===LAST&&st.phase>=1&&st.pr&&!st.pr.done&&!st.pr.replay&&!st.pr.ok){pulse^=1;render()}},3400);
let bad=[];
for(let i=0;i<3000;i++){const p=randomP(),Y=yav(p.n);if(!Y.ok||!Number.isInteger(Y.x))bad.push(p.n)}
PRACTICE.concat([{n:E1}]).forEach(p=>{if(!yav(p.n).ok)bad.push(p.n)});if(!yav(E2).ratio||!yav(E2).ok)bad.push(E2);
console.log(bad.length?'[Vedica] simultaneous tests FAILED '+bad.slice(0,4).join(' | '):'[Vedica] simultaneous equations checked by substitution on 3,000 systems');

/* ---------- chrome ---------- */
const cv=document.getElementById('cv');
cv.innerHTML=`
<div class="abs" style="top:22px;left:36px;right:36px;height:40px;display:flex;align-items:center;justify-content:space-between;z-index:7">
 <div class="nun" style="display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.03em"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#0a84ff;color:#fff;font-size:16px;font-style:italic;box-shadow:0 5px 12px rgba(10,132,255,.22)">V</span>Vedica</div>
 <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600"><span style="color:#8391a6">Simultaneous equations</span><span style="color:#d3dbe4">·</span><span id="sn" style="color:#0a84ff;font-weight:700"></span><span id="sm" style="color:#8290a5"></span></div>
 <button id="x" class="rb" aria-label="Exit lesson" title="Exit lesson" style="width:40px;height:40px"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
<div id="pg" class="abs" style="top:62px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5"></div>
